<script>
/* ===== ค่าของฉาก (ตรงกับสิมเดิมในไฟล์แผน 1 · หน่วย ซม. · มองจากด้านบนของโต๊ะ) =====
   กระจกอยู่บนเส้น x = 0 ยาวจาก y = −20 ถึง 20 · หมุดวัตถุที่ (ระยะวัตถุ, 10) · ตาที่ (45, ตำแหน่งตา)
   รังสีสะท้อนเข้าตาได้เมื่อจุดสะท้อนอยู่บนกระจก (|y| ≤ 20) · ภาพอยู่ที่ (−ระยะวัตถุ, 10) */
const MY = 20, OY = 10, EX = 45, MH = 8, PH = 7, HE = 4;   /* ครึ่งความยาวกระจก · y ของหมุด · x ของตา · สูงกระจก · สูงหมุด · ระดับตา */
const STAGES = ["ฉากก่อนผล", "เล่น", "อ่านค่า", "รังสีทีละเส้น"];
/* ขั้นรังสีแสดงทีละเส้น · ทุกจุดสะท้อนมีเส้นปกติเสมอ (ครูกำหนด 28 ก.ย. 2569) */
const RAYSTEPS = ["รังสีตกกระทบ 1", "เส้นปกติ 1", "รังสีสะท้อน 1", "รังสีตกกระทบ 2", "เส้นปกติ 2", "รังสีสะท้อน 2", "แนวต่อ · ภาพ"];
const EYEW = 6;                                            /* รังสีเส้นที่ 2 เข้าตาที่ห่างจากเส้นแรก 6 ซม. (ตามสิมเดิม 5 ซม. ขยายให้เห็นชัด) */
const S = { stage: 0, sub: 0, ye: -40, ox: 30, anim: null, mode: "2d" };
const RS = () => S.stage === 3 ? S.sub : 0, IMG = () => RS() >= RAYSTEPS.length;
const hitY = ey => ey + (OY - ey) * (EX / (EX + S.ox));    /* จุดสะท้อนบนกระจกของรังสีที่เข้าตาที่ (EX, ey) */
const seen = () => Math.abs(hitY(S.ye)) <= MY;
const $ = id => document.getElementById(id);
const fmt = v => (v < 0 ? "−" : "") + Math.abs(v).toFixed(0);

/* ===== แถบขั้นและปุ่ม ===== */
function buildSteps() {
  $("steps").innerHTML = STAGES.map((t, i) => `<span class="step ${i === S.stage ? "on" : i < S.stage ? "done" : ""}">${i + 1} ${t}${i === 3 && S.stage === 3 ? ` · ${RAYSTEPS[S.sub - 1]} (${S.sub}/${RAYSTEPS.length})` : ""}</span>`).join("");
  const last = S.stage === 3 && S.sub === RAYSTEPS.length;
  $("bPrev").disabled = S.stage === 0; $("bNext").disabled = last; $("bRay").disabled = last;
  $("sE").disabled = S.stage < 1 || !!S.anim; $("sO").disabled = S.stage < 2;
}
function setStage(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === S.stage) return;
  const prev = S.stage; S.stage = n; S.sub = n === 3 ? (prev < 3 ? 1 : S.sub) : 0;
  if (n === 0) { S.anim = null; S.ye = -40; S.ox = 30; }
  if (n === 1 && prev === 0) S.anim = { t0: performance.now(), from: -40, to: 20, dur: 3500 };
  if (n < 2) S.ox = 30;
  syncSliders(); buildSteps(); updateReadout();
}
function next() { if (S.stage === 3) { if (S.sub < RAYSTEPS.length) { S.sub++; buildSteps(); updateReadout(); } } else setStage(S.stage + 1); }
function prev() { if (S.stage === 3 && S.sub > 1) { S.sub--; buildSteps(); updateReadout(); } else setStage(S.stage - 1); }
function syncSliders() { $("sE").value = S.ye; $("sO").value = S.ox; $("vE").textContent = fmt(S.ye) + " ซม."; $("vO").textContent = S.ox + " ซม."; }
function tickAnim(now) {
  if (!S.anim) return;
  const a = S.anim, u = Math.min(1, (now - a.t0) / a.dur), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  S.ye = a.from + (a.to - a.from) * e; $("vE").textContent = fmt(S.ye) + " ซม.";
  if (u >= 1) { S.ye = a.to; S.anim = null; syncSliders(); buildSteps(); }
}
function updateReadout() {
  const r = $("readout");
  if (S.stage < 2 || IMG()) { r.style.display = "none"; return; }
  r.style.display = "block";
  r.innerHTML = `วัตถุ ${S.ox} ซม. · ภาพ <b>${S.ox} ซม.</b> <span style="font-size:.6em;color:var(--mute)">(วัดจากกระจก)</span>`;
}
$("bNext").onclick = next; $("bPrev").onclick = prev;
$("bRay").onclick = () => S.stage < 3 ? setStage(3) : next();
$("sE").oninput = e => { S.ye = +e.target.value; syncSliders(); };
$("sO").oninput = e => { S.ox = +e.target.value; syncSliders(); updateReadout(); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$("b2d").onclick = () => setMode("2d"); $("b3d").onclick = () => setMode("3d");
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "r" || e.key === "R") setStage(Math.max(S.stage, 2));
  else if (e.key === "n" || e.key === "N") $("bRay").click();
  else if (e.key === "d" || e.key === "D") setMode(S.mode === "2d" ? "3d" : "2d");
  else if (e.key === "f" || e.key === "F") $("bFull").click();
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
});

/* ===== 2D: มองจากด้านบนของโต๊ะ ===== */
const c2 = $("c2d"), g = c2.getContext("2d");
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  return { w: cv.width, h: cv.height, dpr };
}
/* มาตราส่วนคงที่ตลอดทั้งไฟล์ (ครูขอ 28 ก.ย. 2569): กรอบครอบทุกตำแหน่งตา −60..60 ซม. ไว้ตั้งแต่แรก ขนาดของในฉากจึงไม่เปลี่ยน
   วางกระจกแนวนอนด้านบน (หลังกระจกอยู่เหนือกระจก) ให้แนวที่ตาเลื่อนอยู่ตามความกว้างจอ: จอ x ← y ของโต๊ะ · จอ y ← x ของโต๊ะ */
const B2 = { y0: -68, y1: 74, x0: -50, x1: 56 };
function draw2D() {
  const { w, h, dpr } = fit(c2), px = v => v * dpr;
  const sc = Math.min(w / (B2.y1 - B2.y0), h / (B2.x1 - B2.x0)) * 0.97;
  const ox = (w - (B2.y1 - B2.y0) * sc) / 2 - B2.y0 * sc, oy = (h - (B2.x1 - B2.x0) * sc) / 2 - B2.x0 * sc;
  const P = (x, y) => [ox + y * sc, oy + x * sc];
  const box = (xa, xb, ya, yb, col) => { const [a, b] = P(Math.min(xa, xb), Math.min(ya, yb)); g.fillStyle = col; g.fillRect(a, b, Math.abs(yb - ya) * sc, Math.abs(xb - xa) * sc); };
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  /* โต๊ะไม้ + กระดาษ */
  g.fillStyle = "#4a3526"; g.fillRect(0, 0, w, h);
  for (let y = -120; y < 120; y += 9) { const [a] = P(0, y); g.strokeStyle = "#3d2b1f"; g.lineWidth = px(1); g.beginPath(); g.moveTo(a, 0); g.lineTo(a, h); g.stroke(); }
  box(-42, 58, -30, 30, "#f4f1e8");
  if (S.stage >= 2) box(-42, 0, -30, 30, "rgba(30,41,59,.28)");
  if (IMG()) { const [a, b] = P(-33, -18); g.fillStyle = "#475569"; g.font = `${px(18)}px 'IBM Plex Sans Thai'`; g.textAlign = "center"; g.fillText("หลังกระจก", a, b); }
  if (S.stage >= 2) rulerTop(P, px, sc);
  /* กระจก: ด้านหลังขีดเงา */
  box(-1.4, 0, -MY, MY, "#94a3b8");
  g.strokeStyle = "#475569"; g.lineWidth = px(1);
  for (let y = -MY; y < MY; y += 2.5) { const [a, b] = P(-1.4, y), [c, d] = P(-3.2, y - 2); g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); }
  { const [a, b] = P(0, -MY); g.fillStyle = "#bae6fd"; g.fillRect(a, b - px(1), 2 * MY * sc, px(4)); }
  { const [a, b] = P(0, -MY); tag("กระจก", a - px(72), b + px(8), px); }
  /* หมุดและภาพ */
  if (S.stage >= 2) pinTop(...P(-S.ox, OY), px, true);
  pinTop(...P(S.ox, OY), px, false);
  { const [a, b] = P(S.ox, OY); tag("วัตถุ", a + px(16), b + px(7), px); }
  if (S.stage >= 2) { const [a, b] = P(-S.ox, OY); tag("ภาพ", a + px(18), b + px(7), px); }
  /* รังสี */
  const k = RS(), okA = seen();
  const ray = (ey, col, k0) => {
    if (k < k0) return;
    const yh = hitY(ey);
    if (Math.abs(yh) > MY) return;
    seg(...P(S.ox, OY), ...P(0, yh), col, px, true);
    if (k >= k0 + 1) normal2D(P, px, yh);
    if (k >= k0 + 2) seg(...P(0, yh), ...P(EX, ey), col, px, true);
    if (IMG()) { const [a, b] = P(0, yh), [c, d] = P(-S.ox, OY); g.strokeStyle = col; g.lineWidth = px(2.2); g.setLineDash([px(8), px(7)]); g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); g.setLineDash([]); }
  };
  ray(S.ye, "#fb923c", 1);
  ray(S.ye + EYEW, "#f472b6", 4);
  $("note").style.display = S.stage >= 3 && !okA ? "block" : "none";
  const [ex, ey] = P(EX, S.ye), [mx, my] = P(0, 0);
  eyeTop(ex, ey, px, Math.atan2(my - ey, mx - ex));
  tag("ตา", ex + px(18), ey + px(28), px);
}
/* ป้ายชื่อบนพื้นเข้ม อ่านได้ทั้งบนกระดาษและบนโต๊ะไม้ */
function tag(t, x, y, px) {
  g.font = `600 ${px(19)}px 'IBM Plex Sans Thai'`; g.textAlign = "left"; const w = g.measureText(t).width;
  g.fillStyle = "rgba(15,23,42,.82)"; g.beginPath(); g.roundRect ? g.roundRect(x - px(6), y - px(19), w + px(12), px(26), px(6)) : g.rect(x - px(6), y - px(19), w + px(12), px(26)); g.fill();
  g.fillStyle = "#f8fafc"; g.fillText(t, x, y);
}
function seg(ax, ay, bx, by, col, px, arr) {
  g.strokeStyle = col; g.lineWidth = px(3.2); g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
  if (arr) { const a = Math.atan2(by - ay, bx - ax), mx = ax + (bx - ax) * .55, my = ay + (by - ay) * .55;
    g.save(); g.translate(mx, my); g.rotate(a); g.fillStyle = col; g.beginPath(); g.moveTo(px(10), 0); g.lineTo(-px(7), -px(6.5)); g.lineTo(-px(7), px(6.5)); g.closePath(); g.fill(); g.restore(); }
}
/* เส้นปกติที่จุดสะท้อน: ตั้งฉากกับกระจก + เครื่องหมายมุมฉาก + N */
function normal2D(P, px, yh) {
  const L = 22, [a, b] = P(0, yh), [c, d] = P(L, yh);
  g.save(); g.strokeStyle = "#0f172a"; g.lineWidth = px(2); g.setLineDash([px(10), px(6)]);
  g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); g.setLineDash([]);
  const q = px(11); g.lineWidth = px(1.5); g.beginPath(); g.moveTo(a + q, b); g.lineTo(a + q, b + q); g.lineTo(a, b + q); g.stroke();
  g.fillStyle = "#0f172a"; g.font = `${px(18)}px 'IBM Plex Sans Thai'`; g.textAlign = "center"; g.fillText("N", c, d + px(20));
  g.restore();
}
function pinTop(x, y, px, ghost) {
  g.save(); g.globalAlpha = ghost ? .5 : 1;
  g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(x + px(4), y + px(4), px(10), px(7), 0, 0, 7); g.fill();
  const gr = g.createRadialGradient(x - px(3), y - px(3), px(1), x, y, px(10)); gr.addColorStop(0, "#fecaca"); gr.addColorStop(1, "#dc2626");
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, px(9), 0, 7); g.fill();
  if (ghost) { g.strokeStyle = "#dc2626"; g.setLineDash([px(4), px(3)]); g.lineWidth = px(2); g.beginPath(); g.arc(x, y, px(13), 0, 7); g.stroke(); }
  g.restore();
}
function eyeTop(x, y, px, a) {
  g.save(); g.translate(x, y); g.rotate(a);
  g.fillStyle = "#fff"; g.strokeStyle = "#0f172a"; g.lineWidth = px(2);
  g.beginPath(); g.moveTo(-px(14), 0); g.quadraticCurveTo(0, -px(13), px(14), 0); g.quadraticCurveTo(0, px(13), -px(14), 0); g.fill(); g.stroke();
  g.fillStyle = "#0ea5e9"; g.beginPath(); g.arc(px(4), 0, px(5.5), 0, 7); g.fill(); g.fillStyle = "#0f172a"; g.beginPath(); g.arc(px(5), 0, px(2.6), 0, 7); g.fill();
  g.restore();
}
/* ไม้บรรทัดวางราบบนโต๊ะชิดขอบกระดาษ (y = 30–37 ซม.) ขนานแนววัตถุ–ภาพ ไม่ทับแนวรังสี */
function rulerTop(P, px, sc) {
  const yr = 37, hR = 7, [a, b] = P(-50, yr - hR);
  g.fillStyle = "#fde68a"; g.fillRect(a, b - px(4), hR * sc, 100 * sc + px(8));
  g.strokeStyle = "#78350f"; g.fillStyle = "#78350f"; g.textAlign = "left"; g.font = `${px(14)}px 'Share Tech Mono'`;
  for (let c = -50; c <= 50; c++) {
    const L = c % 10 === 0 ? hR * .42 : c % 5 === 0 ? hR * .3 : hR * .17, [p, q] = P(c, yr - hR), [r, s] = P(c, yr - hR + L);
    g.lineWidth = px(c % 5 ? 1 : 1.6); g.beginPath(); g.moveTo(p, q); g.lineTo(r, s); g.stroke();
    if (c % 10 === 0) { const [t, u] = P(c, yr - hR * .45); g.fillText(String(Math.abs(c)), t, u + px(5)); }
  }
  g.strokeStyle = "rgba(220,38,38,.8)"; g.setLineDash([px(4), px(4)]); g.lineWidth = px(1.5);
  for (const xx of [S.ox, -S.ox]) { const [p, q] = P(xx, OY), [r, s] = P(xx, yr - hR); g.beginPath(); g.moveTo(p, q); g.lineTo(r, s); g.stroke(); }
  g.setLineDash([]);
}

/* ===== มองจากตา (2D): ฉายจุดจริงจากตำแหน่งตาลงภาพ · ภาพของหมุดเห็นเฉพาะผ่านกรอบกระจก ===== */
function drawEye2D(cv) {
  const e = cv.getContext("2d"), W = cv.width, H = cv.height, f = W / 2 / Math.tan(Math.PI / 8.5);   /* มุมมองกว้างราว 42° */
  const E = [EX, S.ye], gaze = Math.atan2(0 - S.ye, 0 - EX);
  const proj = (x, y, z) => { const dx = x - E[0], dy = y - E[1], a = Math.atan2(dy, dx) - gaze, dist = Math.hypot(dx, dy) * Math.cos(a);
    return [W / 2 - f * Math.tan(a), H * 0.52 - f * (z - HE) / Math.max(dist, 1)]; };
  e.fillStyle = "#1e293b"; e.fillRect(0, 0, W, H);
  const hz = H * 0.52 - f * (0 - HE) / 400;
  e.fillStyle = "#4a3526"; e.fillRect(0, hz, W, H - hz);
  /* กระดาษ */
  const pp = [[-42, 30], [40, 30], [40, -30], [-42, -30]].map(([x, y]) => proj(x, y, 0));
  e.fillStyle = "#f4f1e8"; e.beginPath(); pp.forEach((p, i) => i ? e.lineTo(p[0], p[1]) : e.moveTo(p[0], p[1])); e.closePath(); e.fill();
  /* กรอบกระจก */
  const m = [proj(0, -MY, 0), proj(0, MY, 0), proj(0, MY, MH), proj(0, -MY, MH)];
  e.fillStyle = "#64748b"; e.beginPath(); m.forEach((p, i) => i ? e.lineTo(p[0], p[1]) : e.moveTo(p[0], p[1])); e.closePath(); e.fill();
  e.save(); e.beginPath(); m.forEach((p, i) => i ? e.lineTo(p[0], p[1]) : e.moveTo(p[0], p[1])); e.closePath(); e.clip();
  e.fillStyle = "#cfd8e3"; e.fillRect(0, 0, W, H);                   /* กระดาษที่สะท้อนในกระจก */
  const im = [[-58, 30], [0, 30], [0, -30], [-58, -30]].map(([x, y]) => proj(x, y, 0));
  e.fillStyle = "#e7e4db"; e.beginPath(); im.forEach((p, i) => i ? e.lineTo(p[0], p[1]) : e.moveTo(p[0], p[1])); e.closePath(); e.fill();
  pinSide(e, proj, -S.ox, OY);                                         /* ภาพของหมุด (หลังกระจก) */
  e.fillStyle = "rgba(186,230,253,.18)"; e.fillRect(0, 0, W, H);
  e.restore();
  e.strokeStyle = "#e2e8f0"; e.lineWidth = 2; e.beginPath(); m.forEach((p, i) => i ? e.lineTo(p[0], p[1]) : e.moveTo(p[0], p[1])); e.closePath(); e.stroke();
  pinSide(e, proj, S.ox, OY);                                          /* หมุดจริง (ถ้าอยู่ในมุมมอง) */
}
function pinSide(e, proj, x, y) {
  const b = proj(x, y, 0), t = proj(x, y, PH), s = Math.max(1.5, (b[1] - t[1]) * 0.06);
  e.strokeStyle = "#9ca3af"; e.lineWidth = s; e.beginPath(); e.moveTo(b[0], b[1]); e.lineTo(t[0], t[1]); e.stroke();
  e.fillStyle = "#dc2626"; e.beginPath(); e.arc(t[0], t[1], s * 2.2, 0, 7); e.fill();
}

/* ===== 3D: โต๊ะทดลอง · กระจกสะท้อนจริงด้วย stencil (เห็นภาพเฉพาะในกรอบกระจก) ===== */
let T = null;
function init3D() {
  if (typeof THREE === "undefined") { $("b3d").disabled = true; return; }
  const cv = $("c3d"), R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, stencil: true });
  R.setPixelRatio(devicePixelRatio || 1); R.setClearColor(0x06090f); R.localClippingEnabled = true;
  const eyeR = new THREE.WebGLRenderer({ antialias: true, stencil: true }); eyeR.setSize(360, 270, false); eyeR.setClearColor(0x1e293b); eyeR.localClippingEnabled = true;
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x3b2a1c, 0.8));
  const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(40, 120, 60); sc.add(dl);
  /* พิกัด 3D: x = x บนโต๊ะ · y = ความสูง · z = −y บนโต๊ะ (ซม.) มุมบนจึงวางเหมือนภาพ 2D */
  const clipBehind = [new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0)];   /* ของในโลกสะท้อน เก็บเฉพาะ x ≤ 0 */
  function mat(c, mirror) {
    const m = new THREE.MeshLambertMaterial({ color: c });
    if (mirror) { m.stencilWrite = true; m.stencilRef = 1; m.stencilFunc = THREE.EqualStencilFunc; m.clippingPlanes = clipBehind; }
    return m;
  }
  function buildWorld(mirror) {
    const G = new THREE.Group(), add = (geo, c, x, y, z) => { const o = new THREE.Mesh(geo, mat(c, mirror)); o.position.set(x, y, z); o.renderOrder = mirror ? -2 : 0; G.add(o); return o; };
    add(new THREE.BoxGeometry(200, 4, 160), 0x4a3526, 0, -2, 0);
    add(new THREE.BoxGeometry(100, 0.2, 60), 0xf4f1e8, 8, 0.1, 0);
    const pin = new THREE.Group(); G.add(pin);
    const s1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, PH, 8), mat(0x9ca3af, mirror)); s1.position.y = PH / 2; s1.renderOrder = mirror ? -2 : 0; pin.add(s1);
    const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), mat(0xdc2626, mirror)); s2.position.y = PH; s2.renderOrder = mirror ? -2 : 0; pin.add(s2);
    const eye = new THREE.Group(); G.add(eye);
    const e1 = new THREE.Mesh(new THREE.SphereGeometry(1.6, 20, 16), mat(0xffffff, mirror)); e1.renderOrder = mirror ? -2 : 0; eye.add(e1);
    const e2 = new THREE.Mesh(new THREE.SphereGeometry(0.75, 16, 12), mat(0x0ea5e9, mirror)); e2.position.x = -1.2; e2.renderOrder = mirror ? -2 : 0; eye.add(e2);
    if (mirror) G.scale.x = -1;
    return { G, pin, eye };
  }
  const real = buildWorld(false), virt = buildWorld(true); sc.add(real.G); sc.add(virt.G);
  real.eye.children.forEach(o => o.layers.set(1));                       /* กล้องตาไม่เห็นลูกตาตัวเอง */
  /* หน้ากระจก: (1) เขียน stencil (2) อุดความลึก ให้ของจริงหลังกระจกไม่ทับภาพ (3) สีกระจกจาง ๆ */
  const mGeo = new THREE.PlaneGeometry(2 * MY, MH);
  const mask = new THREE.Mesh(mGeo, new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp }));
  const plug = new THREE.Mesh(mGeo, new THREE.MeshBasicMaterial({ colorWrite: false }));
  const tint = new THREE.Mesh(mGeo, new THREE.MeshBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.12, depthWrite: false }));
  for (const [o, r] of [[mask, -3], [plug, -1], [tint, 1]]) { o.rotation.y = Math.PI / 2; o.position.set(0.02, MH / 2, 0); o.renderOrder = r; sc.add(o); }
  const back = new THREE.Mesh(new THREE.BoxGeometry(1.2, MH + 0.6, 2 * MY + 0.6), new THREE.MeshLambertMaterial({ color: 0x64748b })); back.position.set(-0.62, MH / 2, 0); sc.add(back);
  const stand = new THREE.Mesh(new THREE.BoxGeometry(5, 1.5, 6), new THREE.MeshLambertMaterial({ color: 0x78350f })); stand.position.set(-3.5, 0.75, 0); sc.add(stand);
  /* รังสี ไม้บรรทัด ภาพ */
  const fx = new THREE.Group(); sc.add(fx);
  const cam = new THREE.PerspectiveCamera(40, 1, 1, 2000); cam.layers.enable(1);
  const eyeCam = new THREE.PerspectiveCamera(32, 360 / 270, 0.5, 2000);
  let az = 0.12, el = 0.9, zoom = 1, drag = null, key = "";   /* กล้องอยู่ฝั่งตา มองเข้าหากระจก หมุดกับตาเรียงซ้ายขวา */
  cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, az, el]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!drag) return; az = Math.max(-1.45, Math.min(1.45, drag[2] - (e.clientX - drag[0]) * 0.006)); el = Math.max(0.08, Math.min(1.5, drag[3] + (e.clientY - drag[1]) * 0.005)); });
  cv.addEventListener("pointerup", () => drag = null);
  cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.5, Math.min(2, zoom * (1 + e.deltaY * 0.001))); }, { passive: false });
  $("bTop").onclick = () => { az = 0; el = 1.5; };
  const V = (x, y, h) => new THREE.Vector3(x, h ?? HE, -y);
  function tube(a, b, col, r) { const t = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 1, r || 0.35, 8, false), new THREE.MeshBasicMaterial({ color: col })); fx.add(t); return t; }
  function dash(a, b, col, r, over) {
    const L = a.distanceTo(b), n = Math.max(1, Math.round(L / 2.4)), m = new THREE.MeshBasicMaterial({ color: col, depthTest: !over, transparent: !!over });
    for (let i = 0; i < n; i++) { const u0 = i / n, u1 = u0 + 0.6 / n, c = new THREE.Mesh(new THREE.CylinderGeometry(r || 0.25, r || 0.25, L * (u1 - u0), 6), m);
      c.position.copy(a.clone().lerp(b, (u0 + u1) / 2)); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); if (over) c.renderOrder = 5; fx.add(c); }
  }
  function cone(a, b, col) { const d = b.clone().sub(a).normalize(), c = new THREE.Mesh(new THREE.ConeGeometry(1.1, 3, 12), new THREE.MeshBasicMaterial({ color: col })); c.position.copy(a.clone().lerp(b, 0.55)); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d); fx.add(c); }
  function label(text, col, pos, s) {
    const c = document.createElement("canvas"); c.width = 256; c.height = 64; const x = c.getContext("2d");
    x.font = "44px 'IBM Plex Sans Thai'"; x.fillStyle = col; x.textAlign = "center"; x.fillText(text, 128, 48);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false })); sp.scale.set(s * 4, s, 1); sp.position.copy(pos); sp.renderOrder = 6; fx.add(sp);
  }
  function rebuild() {
    const k2 = [S.stage, S.sub, S.ye.toFixed(2), S.ox].join("|"); if (k2 === key) return; key = k2;
    fx.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
    fx.clear();
    if (S.stage >= 2) {                                                 /* ภาพ + ไม้บรรทัด (อ่านค่า) */
      const gp = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, PH, 12), new THREE.MeshBasicMaterial({ color: 0xdc2626, transparent: true, opacity: 0.35, depthTest: false }));
      gp.position.set(-S.ox, PH / 2, -OY); gp.renderOrder = 5; fx.add(gp);
      const rz = 30, ru = new THREE.Mesh(new THREE.BoxGeometry(104, 0.3, 7), new THREE.MeshLambertMaterial({ color: 0xfde68a })); ru.position.set(0, 0.35, -(rz + 3.5)); fx.add(ru);
      for (let c = -50; c <= 50; c++) { const L = c % 10 === 0 ? 3.2 : c % 5 === 0 ? 2.2 : 1.2, t = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.05, L), new THREE.MeshBasicMaterial({ color: 0x78350f })); t.position.set(c, 0.52, -(rz + L / 2)); fx.add(t);
        if (c % 10 === 0) label(String(Math.abs(c)), "#78350f", new THREE.Vector3(c, 1.5, -(rz + 5)), 2.2); }
      label("ภาพ", "#94a3b8", new THREE.Vector3(-S.ox, PH + 3, -OY), 3);
    }
    const k = RS();
    const ray = (ey, col, k0) => {
      if (k < k0) return; const yh = hitY(ey); if (Math.abs(yh) > MY) return;
      const O = V(S.ox, OY), P = V(0, yh), E = V(EX, ey);
      tube(O, P, col); cone(O, P, col);
      if (k >= k0 + 1) { dash(P, V(22, yh), 0x0f172a, 0.3); label("N", "#0f172a", V(25, yh, HE + 1.5), 3); }
      if (k >= k0 + 2) { tube(P, E, col); cone(P, E, col); }
      if (IMG()) dash(P, V(-S.ox, OY), col, 0.25, true);
    };
    ray(S.ye, 0xfb923c, 1); ray(S.ye + EYEW, 0xf472b6, 4);
  }
  const place = () => { for (const w of [real, virt]) { w.pin.position.set(S.ox, 0, -OY); w.eye.position.set(EX, HE, -S.ye); w.eye.rotation.y = Math.atan2(S.ye, EX); } };
  T = {
    render() {
      const r = cv.getBoundingClientRect(); if (!r.width) return;
      R.setSize(r.width, r.height, false); place(); rebuild();
      const tgt = new THREE.Vector3(IMG() ? 2 : 14, 0, 0), dist = 150 * zoom;   /* จุดเล็งและระยะคงที่ ขนาดของในฉากไม่เปลี่ยนตามตา */
      cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
      cam.position.set(tgt.x + dist * Math.cos(el) * Math.cos(az), tgt.y + dist * Math.sin(el), tgt.z + dist * Math.cos(el) * Math.sin(az));
      cam.up.set(el > 1.45 ? -1 : 0, el > 1.45 ? 0 : 1, 0);   /* มุมบน: กระจกอยู่บน ตรงกับภาพ 2D */ cam.lookAt(tgt); R.render(sc, cam);
    },
    eye(cv2) {
      place(); eyeCam.position.set(EX - 1.8, HE, -S.ye); eyeCam.lookAt(0, HE, 0);
      const fv = fx.visible; fx.visible = false; eyeR.render(sc, eyeCam); fx.visible = fv;
      cv2.getContext("2d").drawImage(eyeR.domElement, 0, 0, cv2.width, cv2.height);
    }
  };
}

/* ===== สลับโหมดและลูปหลัก ===== */
function setMode(m) {
  if (m === "3d" && !T) init3D();
  if (m === "3d" && !T) return;
  S.mode = m; $("b2d").classList.toggle("on", m === "2d"); $("b3d").classList.toggle("on", m === "3d");
  $("c2d").style.display = m === "2d" ? "block" : "none"; $("c3d").style.display = m === "3d" ? "block" : "none";
  $("bTop").style.display = m === "3d" ? "inline-block" : "none";
}
function loop(now) {
  tickAnim(now);
  $("inset").style.display = S.stage >= 1 ? "block" : "none"; $("wait").style.display = S.stage >= 1 ? "none" : "block";
  if (S.mode === "2d") { draw2D(); if (S.stage >= 1) drawEye2D($("eyeV")); }
  else if (T) { if (S.stage >= 1) T.eye($("eyeV")); T.render(); $("note").style.display = S.stage >= 3 && !seen() ? "block" : "none"; }
  requestAnimationFrame(loop);
}
syncSliders(); buildSteps(); updateReadout(); requestAnimationFrame(loop);
</script>
</body>
