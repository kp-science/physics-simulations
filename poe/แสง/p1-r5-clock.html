<style>
/* KP Science · POE ตัวเล่นหน้าห้อง · แผน 1 รอบ 5

:root{--bg:#06090f;--panel:#0d1420;--line:#1e2a3d;--txt:#e6edf6;--mute:#8b9bb4;
  --accent:#38bdf8;--accent2:#a78bfa;--accent3:#4ade80;--accent4:#fb923c;--accent5:#f472b6}

#c2d,#c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.side .box{background:#0b111cdd;border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px}

    <div class="ctl">นาฬิกาห่างกระจก <input type="range" id="sC" min="1.5" max="3" step="0.5" value="2.5"><span class="v" id="vC">2.5 m</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(typeof THREE==="undefined"){ document.write('<script src="../../_shared/three.min.js"><\/script>'); }</script>
<script>
/* ===== ค่าของฉาก (ตรงกับสิมเดิมในไฟล์แผน 1 · มองด้านข้าง · หน่วย m) =====
   กระจกบนผนังที่ x = 0 สูง 0.8–2.2 m · ตาอยู่ที่ x = ex สูง 1.6 m · นาฬิกาบนผนังหลังที่ x = cx สูง 2.0 m (รัศมี 0.15 m)
   ภาพนาฬิกาอยู่ที่ x = −cx · ระยะตาถึงภาพ (แนวระดับ) = ex + cx · ค่าเริ่ม ex 1.0 · cx 2.5 → 3.5 m (7 ช่อง ช่องละ 0.5 m)
   รอบนี้ไม่มีของจริง (ใช้สิมอย่างเดียว ตามแผน) */
const MLO = 0.8, MHI = 2.2, MW = 1.0, EYE = 1.6, CY = 2.0, CR = 0.15, FACE = 0.09, WALLH = 2.45;
const STAGES = ["ฉากก่อนผล", "เล่น", "อ่านค่า", "รังสีทีละเส้น"];
/* ขั้นรังสีแสดงทีละเส้น · ทุกจุดสะท้อนมีเส้นปกติเสมอ (ครูกำหนด 28 ก.ย. 2569) */
const RAYSTEPS = ["รังสีตกกระทบ 1", "เส้นปกติ 1", "รังสีสะท้อน 1", "รังสีตกกระทบ 2", "เส้นปกติ 2", "รังสีสะท้อน 2", "แนวต่อ · ภาพ", "ระยะตาถึงภาพ"];
const S = { stage: 0, sub: 0, ex: 1, cx: 2.5, mode: "2d" };
const RS = () => S.stage === 3 ? S.sub : 0;
const hit = h => EYE + (h - EYE) * (S.ex / (S.ex + S.cx));   /* จุดสะท้อนบนกระจกของรังสีจากจุดสูง h บนนาฬิกาที่เข้าตา */
const $ = id => document.getElementById(id);
const f1 = v => v.toFixed(1);

/* ===== แถบขั้นและปุ่ม ===== */
function buildSteps() {
  $("steps").innerHTML = STAGES.map((t, k) => `<span class="step ${k === S.stage ? "on" : k < S.stage ? "done" : ""}">${k + 1} ${t}${k === 3 && S.stage === 3 ? ` · ${RAYSTEPS[S.sub - 1]} (${S.sub}/${RAYSTEPS.length})` : ""}</span>`).join("");
  const last = S.stage === 3 && S.sub === RAYSTEPS.length;
  $("bPrev").disabled = S.stage === 0; $("bNext").disabled = last; $("bRay").disabled = last;
  $("sE").disabled = S.stage < 2; $("sC").disabled = S.stage < 2;
}
function setStage(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === S.stage) return;
  const prev = S.stage; S.stage = n; S.sub = n === 3 ? (prev < 3 ? 1 : S.sub) : 0;
  if (n < 2) { S.ex = 1; S.cx = 2.5; }
  syncSliders(); buildSteps(); updateReadout();
}
function next() { if (S.stage === 3) { if (S.sub < RAYSTEPS.length) { S.sub++; buildSteps(); } } else setStage(S.stage + 1); }
function prev() { if (S.stage === 3 && S.sub > 1) { S.sub--; buildSteps(); } else setStage(S.stage - 1); }
function syncSliders() { $("sE").value = S.ex; $("sC").value = S.cx; $("vE").textContent = f1(S.ex) + " m"; $("vC").textContent = f1(S.cx) + " m"; }
/* อ่านค่า: บอกเฉพาะเงื่อนไขของโจทย์ · ระยะตาถึงภาพให้นักเรียนนับช่องเอง (งานในใบ O) */
function updateReadout() {
  const r = $("readout");
  if (S.stage < 2) { r.style.display = "none"; return; }
  r.style.display = "block"; r.innerHTML = `ตาห่างกระจก ${f1(S.ex)} m · นาฬิกาห่างตัว ${f1(S.cx - S.ex)} m · <b>1 ช่อง = 0.5 m</b>`;
}
$("bNext").onclick = next; $("bPrev").onclick = prev;
$("bRay").onclick = () => S.stage < 3 ? setStage(3) : next();
$("sE").oninput = e => { S.ex = +e.target.value; if (S.cx < S.ex + 0.5) S.cx = S.ex + 0.5; syncSliders(); updateReadout(); };
$("sC").oninput = e => { S.cx = Math.max(+e.target.value, S.ex + 0.5); syncSliders(); updateReadout(); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$("b2d").onclick = () => setMode("2d"); $("b3d").onclick = () => setMode("3d");
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "r" || e.key === "R") setStage(Math.max(S.stage, 2));
  else if (e.key === "n" || e.key === "N") $("bRay").click();
  else if (e.key === "d" || e.key === "D") setMode(S.mode === "2d" ? "3d" : "2d");
  else if (e.key === "f" || e.key === "F") $("bFull").click();
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
});

/* ===== 2D: มองด้านข้าง · มาตราส่วนคงที่ (กรอบครอบนาฬิกาและภาพที่ระยะสูงสุด 3 m ไว้ตั้งแต่แรก) ===== */
const c2 = $("c2d"), g = c2.getContext("2d");
const B2 = { x0: -3.35, x1: 3.35, y0: -0.42, y1: 2.55 };
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  return { w: cv.width, h: cv.height, dpr };
}
function draw2D() {
  const { w, h, dpr } = fit(c2), px = v => v * dpr;
  const sc = Math.min(w / (B2.x1 - B2.x0), h / (B2.y1 - B2.y0)) * 0.97;
  const ox = (w - (B2.x1 - B2.x0) * sc) / 2 - B2.x0 * sc, oy = (h - (B2.y1 - B2.y0) * sc) / 2 + B2.y1 * sc;
  const X = x => ox + x * sc, Y = y => oy - y * sc;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  /* ห้องจริง (ขวาของกระจก) */
  const grd = g.createLinearGradient(0, Y(WALLH), 0, Y(0)); grd.addColorStop(0, "#101a2a"); grd.addColorStop(1, "#15233a");
  g.fillStyle = grd; g.fillRect(X(0), Y(WALLH), X(S.cx) - X(0), Y(0) - Y(WALLH));
  g.fillStyle = "#3a2a1c"; g.fillRect(X(0), Y(0), X(S.cx) - X(0), px(12));
  /* ฝั่งหลังกระจก: ภาพของห้อง แสดงตั้งแต่ขั้นเล่น */
  if (S.stage >= 1) {
    g.fillStyle = "#0b1320"; g.fillRect(X(-S.cx), Y(WALLH), X(0) - X(-S.cx), Y(0) - Y(WALLH));
    g.setLineDash([px(6), px(6)]); g.strokeStyle = "#2b3b55"; g.lineWidth = px(1.5);
    g.beginPath(); g.moveTo(X(-S.cx), Y(0)); g.lineTo(X(0), Y(0)); g.moveTo(X(-S.cx), Y(0)); g.lineTo(X(-S.cx), Y(WALLH)); g.stroke(); g.setLineDash([]);
    g.fillStyle = "#64748b"; g.font = `${px(17)}px 'IBM Plex Sans Thai'`; g.textAlign = "center"; g.fillText("หลังกระจก (ภาพ)", X(-S.cx / 2), Y(WALLH) + px(22));
    clock2D(X, Y, sc, px, -S.cx, true);
    person2D(X, Y, sc, px, -(S.ex + FACE), +1, true);
  }
  /* กริดบนพื้น (อ่านค่า): ช่องละ 0.5 m ใต้พื้น ทั้งสองฝั่ง */
  if (S.stage >= 2) grid(X, Y, px);
  /* ผนังกระจก ผนังหลัง นาฬิกา */
  g.fillStyle = "#26344a"; g.fillRect(X(0) - px(14), Y(WALLH), px(14), Y(0) - Y(WALLH) + px(12));
  g.fillStyle = "#b9c7d8"; g.fillRect(X(0) - px(3), Y(MHI) - px(4), px(7), Y(MLO) - Y(MHI) + px(8));
  const mg = g.createLinearGradient(X(0), 0, X(0) + px(6), 0); mg.addColorStop(0, "#9fdcff"); mg.addColorStop(1, "#e8f7ff");
  g.fillStyle = mg; g.fillRect(X(0), Y(MHI), px(5), Y(MLO) - Y(MHI));
  g.fillStyle = "#26344a"; g.fillRect(X(S.cx), Y(WALLH), px(14), Y(0) - Y(WALLH) + px(12));
  clock2D(X, Y, sc, px, S.cx, false);
  tag("กระจก", X(0) + px(10), Y(MHI) + px(4), px);   /* ไว้เหนือกระจก ไม่ทับแถบระยะขั้นสุดท้าย */
  tag("ผนังหลัง", X(S.cx) - px(92), Y(0.25), px);
  person2D(X, Y, sc, px, S.ex + FACE, -1, false);
  /* รังสี: จากขอบบน/ขอบล่างนาฬิกา → กระจก → ตา · แนวต่อไปพบภาพนาฬิกา */
  const k = RS();
  const ray = (hc, col, k0) => {
    if (k < k0) return;
    const m = hit(hc);
    seg([X(S.cx - 0.02), Y(hc)], [X(0), Y(m)], col, px);
    if (k >= k0 + 1) normal2D(X, Y, px, m);
    if (k >= k0 + 2) seg([X(0), Y(m)], [X(S.ex), Y(EYE)], col, px);
    if (k >= 7) { g.save(); g.strokeStyle = col; g.lineWidth = px(2.2); g.setLineDash([px(8), px(7)]); g.beginPath(); g.moveTo(X(0), Y(m)); g.lineTo(X(-S.cx + 0.02), Y(hc)); g.stroke(); g.restore(); }
  };
  ray(CY + CR, "#fb923c", 1);
  ray(CY - CR, "#f472b6", 4);
  if (k >= 8) dims(X, Y, px);
  eyeMark(X(S.ex), Y(EYE), px);
}
function tag(t, x, y, px) {
  g.font = `600 ${px(17)}px 'IBM Plex Sans Thai'`; g.textAlign = "left"; const w = g.measureText(t).width;
  g.fillStyle = "rgba(15,23,42,.85)"; g.beginPath(); g.roundRect ? g.roundRect(x - px(6), y - px(18), w + px(12), px(25), px(6)) : g.rect(x - px(6), y - px(18), w + px(12), px(25)); g.fill();

      cv2.getContext("2d").drawImage(eyeR.domElement, 0, 0, cv2.width, cv2.height);
    }
  };
}

/* ===== สลับโหมดและลูปหลัก ===== */
function setMode(m) {
  if (m === "3d" && !T) init3D();
  if (m === "3d" && !T) return;
  S.mode = m; $("b2d").classList.toggle("on", m === "2d"); $("b3d").classList.toggle("on", m === "3d");
  $("c2d").style.display = m === "2d" ? "block" : "none"; $("c3d").style.display = m === "3d" ? "block" : "none";
}
function loop() {
  $("inset").style.display = S.stage >= 1 ? "block" : "none"; $("wait").style.display = S.stage >= 1 ? "none" : "block";
  if (S.mode === "2d") { draw2D(); if (S.stage >= 1) drawEye2D($("eyeV")); }
  else if (T) { if (S.stage >= 1) T.eye($("eyeV")); T.render(); }
  requestAnimationFrame(loop);
}
syncSliders(); buildSteps(); updateReadout(); requestAnimationFrame(loop);
</script>
