<script>
/* ===== ค่าของฉาก (ตรงกับสิมเดิมในไฟล์แผน 1 · มองจากด้านบน · หน่วย m) =====
   กระจกบานใหญ่บนผนัง x = 0 (กว้าง −1 ถึง 1 m) · ตาเริ่มที่ 3 m เดินเข้าหากระจก 0.5 m/s กดทีละ 1 วินาที สูงสุด 4 s
   ตำแหน่งตา x = 3 − 0.5t · ภาพของตาที่ −x · ระยะตาถึงภาพ = 2x (6, 5, 4, 3, 2 m) · รอบนี้ไม่มีของจริง (ตามแผน) */
const X0 = 3, V = 0.5, TMAX = 4, MY = 1.0, EYE = 1.6, FACE = 0.1, SH = 0.22;
const STAGES = ["ฉากก่อนผล", "เล่น", "อ่านค่า", "รังสีทีละเส้น"];
/* ขั้นรังสีแสดงทีละเส้น · ทุกจุดสะท้อนมีเส้นปกติเสมอ (ครูกำหนด 28 ก.ย. 2569) */
const RAYSTEPS = ["รังสีตกกระทบ 1", "เส้นปกติ 1", "รังสีสะท้อน 1", "รังสีตกกระทบ 2", "เส้นปกติ 2", "รังสีสะท้อน 2", "แนวต่อ · ภาพ", "ระยะตาถึงภาพ"];
const S = { stage: 0, sub: 0, t: 0, tShow: 0, anim: null, mode: "2d" };
const RS = () => S.stage === 3 ? S.sub : 0;
const xe = () => X0 - V * S.tShow;                         /* ตำแหน่งตา = ระยะจากกระจกตามโจทย์ (3.0, 2.5, …) · ระยะตาถึงภาพ = 2 × ค่านี้ ตรงสิมเดิม */
const xp = () => xe() + FACE;                              /* แกนตัวคน */
const $ = id => document.getElementById(id);
const f1 = v => v.toFixed(1);

/* ===== แถบขั้นและปุ่ม ===== */
function buildSteps() {
  $("steps").innerHTML = STAGES.map((t, k) => `<span class="step ${k === S.stage ? "on" : k < S.stage ? "done" : ""}">${k + 1} ${t}${k === 3 && S.stage === 3 ? ` · ${RAYSTEPS[S.sub - 1]} (${S.sub}/${RAYSTEPS.length})` : ""}</span>`).join("");
  const last = S.stage === 3 && S.sub === RAYSTEPS.length;
  $("bPrev").disabled = S.stage === 0; $("bNext").disabled = last; $("bRay").disabled = last;
  $("bWalk").disabled = S.stage < 1 || S.t >= TMAX || !!S.anim; $("bReset").disabled = S.stage < 1 || !!S.anim || S.t === 0;
}
function setStage(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === S.stage) return;
  const prev = S.stage; S.stage = n; S.sub = n === 3 ? (prev < 3 ? 1 : S.sub) : 0;
  if (n === 0) { S.anim = null; S.t = 0; S.tShow = 0; }
  buildSteps(); updateReadout();
}
function next() { if (S.stage === 3) { if (S.sub < RAYSTEPS.length) { S.sub++; buildSteps(); } } else setStage(S.stage + 1); }
function prev() { if (S.stage === 3 && S.sub > 1) { S.sub--; buildSteps(); } else setStage(S.stage - 1); }
function walk() { if (S.stage < 1 || S.t >= TMAX || S.anim) return; S.anim = { t0: performance.now(), from: S.t, to: S.t + 1 }; S.t++; buildSteps(); }
function tickAnim(now) {
  if (!S.anim) return;
  const u = Math.min(1, (now - S.anim.t0) / 1000);        /* เดินจริง 1 วินาที ความเร็วคงที่ */
  S.tShow = S.anim.from + (S.anim.to - S.anim.from) * u;
  if (u >= 1) { S.tShow = S.anim.to; S.anim = null; buildSteps(); updateReadout(); }
}
/* อ่านค่า: บอกเวลาและความเร็วเดิน (เงื่อนไขโจทย์) · ระยะตาถึงภาพให้นักเรียนอ่านเองจากไม้บรรทัด */
function updateReadout() {
  const r = $("readout");
  if (S.stage < 2) { r.style.display = "none"; return; }
  r.style.display = "block"; r.innerHTML = `เดินเข้าหากระจก 0.5 m/s · <b>ไม้บรรทัดวัดจากกระจก</b>`;
}
$("bNext").onclick = next; $("bPrev").onclick = prev;
$("bRay").onclick = () => S.stage < 3 ? setStage(3) : next();
$("bWalk").onclick = walk;
$("bReset").onclick = () => { if (S.anim) return; S.t = 0; S.tShow = 0; buildSteps(); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$("b2d").onclick = () => setMode("2d"); $("b3d").onclick = () => setMode("3d");
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "w" || e.key === "W") walk();
  else if (e.key === "r" || e.key === "R") setStage(Math.max(S.stage, 2));
  else if (e.key === "n" || e.key === "N") $("bRay").click();
  else if (e.key === "d" || e.key === "D") setMode(S.mode === "2d" ? "3d" : "2d");
  else if (e.key === "f" || e.key === "F") $("bFull").click();
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
});

/* ===== 2D: มองจากด้านบน · มาตราส่วนคงที่ (กรอบครอบคนและภาพที่ 3 m ไว้ตั้งแต่แรก) ===== */
const c2 = $("c2d"), g = c2.getContext("2d");
const B2 = { x0: -3.6, x1: 3.6, y0: -1.55, y1: 1.3 };
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  return { w: cv.width, h: cv.height, dpr };
}
function draw2D() {
  const { w, h, dpr } = fit(c2), px = v => v * dpr;
  const sc = Math.min(w / (B2.x1 - B2.x0), h / (B2.y1 - B2.y0)) * 0.97;
  const ox = (w - (B2.x1 - B2.x0) * sc) / 2 - B2.x0 * sc, oy = (h - (B2.y1 - B2.y0) * sc) / 2 + B2.y1 * sc;
  const P = (x, y) => [ox + x * sc, oy - y * sc];
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  /* พื้นห้อง (กระเบื้อง 0.5 m) */
  { const [a, b] = P(0, 1.2), [c, d] = P(3.5, -1.2); g.fillStyle = "#cbbfa8"; g.fillRect(a, b, c - a, d - b);
    g.strokeStyle = "#b3a68c"; g.lineWidth = px(1); for (let x = 0; x <= 3.5; x += 0.5) { const [p] = P(x, 0); g.beginPath(); g.moveTo(p, b); g.lineTo(p, d); g.stroke(); }
    for (let y = -1; y <= 1; y += 0.5) { const [, q] = P(0, y); g.beginPath(); g.moveTo(a, q); g.lineTo(c, q); g.stroke(); } }
  if (S.stage >= 1) {                                               /* ฝั่งหลังกระจก (ภาพของห้อง) */
    const [a, b] = P(-3.5, 1.2), [c, d] = P(0, -1.2); g.fillStyle = "#8f8676"; g.fillRect(a, b, c - a, d - b);
    g.fillStyle = "#e2e8f0"; g.font = `${px(17)}px 'IBM Plex Sans Thai'`; g.textAlign = "center"; g.fillText("หลังกระจก (ภาพ)", (a + c) / 2, b + px(22));
  }
  /* รอยตำแหน่งทุกวินาที (คนและภาพ) */
  if (S.stage >= 1) for (let k = 0; k <= Math.min(S.t, TMAX); k++) {
    if (k > S.tShow + 1e-6) continue; const x = X0 - V * k;   /* รอยที่ตำแหน่งตา */
    for (const s of [1, -1]) { const [a, b] = P(s * x, -0.62); g.fillStyle = s > 0 ? "#b45309" : "#78716c"; g.beginPath(); g.arc(a, b, px(6), 0, 7); g.fill();
      g.fillStyle = "#1f2937"; g.font = `${px(13)}px 'Share Tech Mono'`; g.textAlign = "center"; g.fillText(`${k}s`, a, b + px(20)); }
  }
  if (S.stage >= 2) ruler(P, px, sc);
  /* ผนังกระจก */
  { const [a, b] = P(0, 1.3), [, d] = P(0, -1.55); g.fillStyle = "#334155"; g.fillRect(a - px(12), b, px(12), d - b); }
  { const [a, b] = P(0, MY), [, d] = P(0, -MY); g.fillStyle = "#bae6fd"; g.fillRect(a - px(2), b, px(5), d - b); }
  { const [a, b] = P(0, -1.3); tag("กระจก", a + px(10), b + px(10), px); }   /* ใต้ไม้บรรทัด ไม่ทับแถบระยะด้านบน */
  /* คนและภาพ */
  if (S.stage >= 1) personTop(P, px, sc, -xp(), +1, true);
  personTop(P, px, sc, xp(), -1, false);
  /* รังสี: จากไหล่ซ้าย/ขวา → กระจก → ตา */
  const k = RS(), E = [xe(), 0];
  const ray = (s, col, k0) => {
    if (k < k0) return;
    const Sh = [xp(), s], yh = s * (E[0] / (E[0] + xp())), Q = [0, yh];
    seg(P(...Sh), P(...Q), col, px);
    if (k >= k0 + 1) normal2D(P, px, yh);
    if (k >= k0 + 2) seg(P(...Q), P(...E), col, px);
    if (k >= 7) dash(P(...Q), P(-xp(), s), col, px);
  };
  ray(SH, "#fb923c", 1); ray(-SH, "#f472b6", 4);
  if (k >= 8) dims(P, px);
}
function personTop(P, px, sc, x, f, ghost) {
  const [a, b] = P(x, 0);
  g.save(); g.globalAlpha = ghost ? .55 : 1; g.translate(a, b);
  g.fillStyle = "#2563eb"; g.beginPath(); g.ellipse(0, 0, 0.13 * sc, SH * sc + px(3), 0, 0, 7); g.fill();          /* ไหล่ */
  g.fillStyle = "#1d4ed8"; g.beginPath(); g.arc(0, -(SH + 0.02) * sc, 0.05 * sc, 0, 7); g.arc(0, (SH + 0.02) * sc, 0.05 * sc, 0, 7); g.fill();
  g.fillStyle = "#3b2416"; g.beginPath(); g.arc(0, 0, 0.1 * sc, 0, 7); g.fill();                                   /* ศีรษะ */
  g.fillStyle = "#e8b48f"; g.beginPath(); g.arc(f * 0.07 * sc, 0, 0.045 * sc, 0, 7); g.fill();                      /* หน้า/จมูก หันไปทาง f */
  g.restore();
  if (!ghost) { const [p, q] = P(x - FACE, 0); g.fillStyle = "#fff"; g.beginPath(); g.ellipse(p, q, px(4), px(6), 0, 0, 7); g.fill(); g.fillStyle = "#0ea5e9"; g.beginPath(); g.arc(p - px(1), q, px(2.5), 0, 7); g.fill(); }
  tag(ghost ? "ภาพ" : "เรา", a - px(18), b - (SH + 0.14) * sc, px);
}
function tag(t, x, y, px) {
  g.font = `600 ${px(17)}px 'IBM Plex Sans Thai'`; g.textAlign = "left"; const w = g.measureText(t).width;
  g.fillStyle = "rgba(15,23,42,.85)"; g.beginPath(); g.roundRect ? g.roundRect(x - px(6), y - px(18), w + px(12), px(25), px(6)) : g.rect(x - px(6), y - px(18), w + px(12), px(25)); g.fill();
  g.fillStyle = "#f8fafc"; g.fillText(t, x, y);
}
function seg(a, b, col, px) {
  g.strokeStyle = col; g.lineWidth = px(3.2); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  const an = Math.atan2(b[1] - a[1], b[0] - a[0]), mx = a[0] + (b[0] - a[0]) * .55, my = a[1] + (b[1] - a[1]) * .55;
  g.save(); g.translate(mx, my); g.rotate(an); g.fillStyle = col; g.beginPath(); g.moveTo(px(10), 0); g.lineTo(-px(7), -px(6.5)); g.lineTo(-px(7), px(6.5)); g.closePath(); g.fill(); g.restore();
}
function dash(a, b, col, px) { g.save(); g.strokeStyle = col; g.lineWidth = px(2.2); g.setLineDash([px(8), px(7)]); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); g.restore(); }
/* เส้นปกติที่จุดสะท้อน: ตั้งฉากกับกระจก + มุมฉาก + N */
function normal2D(P, px, yh) {
  const [a, b] = P(0, yh), [c] = P(0.6, yh);
  g.save(); g.strokeStyle = "#0f172a"; g.lineWidth = px(2); g.setLineDash([px(9), px(6)]); g.beginPath(); g.moveTo(a, b); g.lineTo(c, b); g.stroke(); g.setLineDash([]);
  const q = px(10); g.lineWidth = px(1.5); g.beginPath(); g.moveTo(a + q, b); g.lineTo(a + q, b - q * Math.sign(yh || 1)); g.lineTo(a, b - q * Math.sign(yh || 1)); g.stroke();
  g.fillStyle = "#0f172a"; g.font = `600 ${px(16)}px 'IBM Plex Sans Thai'`; g.textAlign = "left"; g.fillText("N", c + px(5), b + px(6)); g.restore();
}
/* ไม้บรรทัดวัดจากกระจก 0–3.5 m ทั้งสองฝั่ง ตัวเลขทุก 0.5 m + เส้นดิ่งจากตาและจากภาพ */
function ruler(P, px, sc) {
  const yr = -1.05, hR = 0.26, [a, b] = P(-3.5, yr + hR / 2), [c, d] = P(3.5, yr - hR / 2);
  g.fillStyle = "#fde68a"; g.fillRect(a, b, c - a, d - b);
  g.strokeStyle = "#78350f"; g.fillStyle = "#78350f"; g.font = `${px(14)}px 'Share Tech Mono'`; g.textAlign = "center";
  for (let v = -3.5; v <= 3.5001; v += 0.1) { const r = Math.round(v * 10), [p, q] = P(v, yr + hR / 2), L = r % 5 === 0 ? hR * .45 : hR * .22;
    g.lineWidth = px(r % 5 ? 1 : 1.6); g.beginPath(); g.moveTo(p, q); g.lineTo(p, q + L * sc); g.stroke();
    if (r % 5 === 0) g.fillText(f1(Math.abs(v)), p, q + hR * sc - px(3)); }
  g.save(); g.setLineDash([px(5), px(5)]); g.strokeStyle = "#16a34a"; g.lineWidth = px(2);
  for (const x of [xe(), -xe()]) { const [p, q] = P(x, 0), [, r] = P(x, yr + hR / 2); g.beginPath(); g.moveTo(p, q); g.lineTo(p, r); g.stroke(); }
  g.restore();
}
function dims(P, px) {
  const bar = (xa, xb, y, col, t) => {
    const [a, q] = P(xa, y), [b] = P(xb, y);
    g.save(); g.strokeStyle = col; g.lineWidth = px(2.5); g.beginPath(); g.moveTo(a, q); g.lineTo(b, q); g.moveTo(a, q - px(7)); g.lineTo(a, q + px(7)); g.moveTo(b, q - px(7)); g.lineTo(b, q + px(7)); g.stroke(); g.restore();
    g.font = `600 ${px(17)}px 'Share Tech Mono'`; const w = g.measureText(t).width;
    g.fillStyle = "rgba(15,23,42,.9)"; g.fillRect((a + b) / 2 - w / 2 - px(6), q - px(24), w + px(12), px(22)); g.fillStyle = col; g.textAlign = "center"; g.fillText(t, (a + b) / 2, q - px(8));
  };
  bar(0, xe(), 0.72, "#b45309", `${f1(xe())} m`); bar(-xe(), 0, 0.72, "#b45309", `${f1(xe())} m`);
  bar(-xe(), xe(), 0.98, "#15803d", `ตา–ภาพ ${f1(2 * xe())} m`);
}

/* ===== มองจากตา (2D): เห็นตัวเองในกระจกที่ระยะ 2x · ยิ่งเดินใกล้ ภาพยิ่งใหญ่ ===== */
function drawEye2D(cv) {
  const e = cv.getContext("2d"), W = cv.width, H = cv.height, F = 230, cy = H * 0.42, d = 2 * xe();
  const P = (z, y, dist) => [W / 2 + F * z / dist, cy - F * (y - EYE) / dist];
  e.fillStyle = "#c9dbe6"; e.fillRect(0, 0, W, H);                  /* ห้องที่สะท้อน */
  const [, fy] = P(0, 0, xe() + 3.5); e.fillStyle = "#a89f8e"; e.fillRect(0, fy, W, H - fy);
  const R = (y0, y1, z0, z1, col) => { const [p, q] = P(z0, y1, d), [s, t] = P(z1, y0, d); e.fillStyle = col; e.fillRect(p, q, s - p, t - q); };
  R(0.07, 0.88, -0.14, 0.14, "#1f2937"); R(0.86, 1.46, -0.2, 0.2, "#2563eb"); R(0.8, 1.4, -0.27, -0.2, "#1d4ed8"); R(0.8, 1.4, 0.2, 0.27, "#1d4ed8"); R(0.88, 0.93, -0.2, 0.2, "#78350f"); R(1.44, 1.52, -0.03, 0.03, "#e8b48f");
  const [hx, hy] = P(0, 1.59, d); e.fillStyle = "#e8b48f"; e.beginPath(); e.arc(hx, hy, F * 0.11 / d, 0, 7); e.fill();
  e.fillStyle = "#3b2416"; e.beginPath(); e.arc(hx, hy - F * 0.03 / d, F * 0.112 / d, Math.PI, 2 * Math.PI); e.fill();
  e.fillStyle = "rgba(186,230,253,.10)"; e.fillRect(0, 0, W, H);
}

/* ===== 3D: ผนังมีกระจกบานใหญ่ = ช่องมองเข้าห้องเสมือนที่สะท้อนกลับด้าน ===== */
let T = null;
function init3D() {
  if (typeof THREE === "undefined") { $("b3d").disabled = true; return; }
  const cv = $("c3d"), R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  R.setPixelRatio(devicePixelRatio || 1); R.setClearColor(0x06090f);
  const eyeR = new THREE.WebGLRenderer({ antialias: true }); eyeR.setSize(360, 270, false); eyeR.setClearColor(0x06090f);
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xdbeafe, 0x2b2014, 0.8));
  const dl = new THREE.DirectionalLight(0xffffff, 0.5); dl.position.set(1, 5, 3); sc.add(dl);
  const M = c => new THREE.MeshLambertMaterial({ color: c });
  /* พิกัด 3D: x = ระยะจากกระจก · y = ความสูง · z = −y ของภาพมุมบน */
  function buildPerson() {
    const G = new THREE.Group(), add = (geo, c, x, y, z) => { const m = new THREE.Mesh(geo, M(c)); m.position.set(x, y, z); G.add(m); return m; };
    add(new THREE.BoxGeometry(0.2, 0.05, 0.1), 0x111827, -0.03, 0.025, -0.08); add(new THREE.BoxGeometry(0.2, 0.05, 0.1), 0x111827, -0.03, 0.025, 0.08);
    add(new THREE.CylinderGeometry(0.06, 0.055, 0.83, 16), 0x1f2937, 0, 0.47, -0.08); add(new THREE.CylinderGeometry(0.06, 0.055, 0.83, 16), 0x1f2937, 0, 0.47, 0.08);
    add(new THREE.BoxGeometry(0.22, 0.6, 0.4), 0x2563eb, 0, 1.16, 0);
    add(new THREE.BoxGeometry(0.225, 0.05, 0.405), 0x78350f, 0, 0.905, 0);
    for (const z of [-0.235, 0.235]) { add(new THREE.CylinderGeometry(0.04, 0.035, 0.6, 12), 0x1d4ed8, 0, 1.1, z); add(new THREE.SphereGeometry(0.045, 12, 12), 0xe8b48f, 0, 0.77, z); }
    add(new THREE.CylinderGeometry(0.035, 0.035, 0.08, 12), 0xe8b48f, 0, 1.48, 0);
    const head = add(new THREE.SphereGeometry(0.11, 24, 20), 0xe8b48f, 0, 1.59, 0);
    const hair = add(new THREE.SphereGeometry(0.114, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), 0x3b2416, 0.01, 1.61, 0);
    return { G, head, hair };
  }
  function buildRoom(G) {
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.6), M(0xcbbfa8)); fl.rotation.x = -Math.PI / 2; fl.position.set(1.8, 0, 0); G.add(fl);
    for (let x = 0.5; x < 3.6; x += 0.5) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.002, 2.6), M(0xb3a68c)); l.position.set(x, 0.001, 0); G.add(l); }
    const bw = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.5, 2.6), M(0x475569)); bw.position.set(3.63, 1.25, 0); G.add(bw);
    const p = buildPerson(); G.add(p.G); return p;
  }
  const room = new THREE.Group(), virt = new THREE.Group(); sc.add(room); sc.add(virt);
  const realP = buildRoom(room), virtP = buildRoom(virt); virt.scale.x = -1;
  realP.head.layers.set(1); realP.hair.layers.set(1);
  const wallMat = new THREE.MeshLambertMaterial({ color: 0x334155, transparent: true, opacity: 1 });
  { const Wd = 20, Hw = 10, th = 0.06, lo = 0.05, hi = 2.3, box = (zc, zw, yc, yh) => { const m = new THREE.Mesh(new THREE.BoxGeometry(th, yh, zw), wallMat); m.position.set(-th / 2, yc, zc); sc.add(m); };
    box(0, 2 * MY, (hi + Hw) / 2, Hw - hi); box(0, 2 * MY, lo / 2, lo); box(-(Wd / 2 + MY) / 2, Wd / 2 - MY, Hw / 2, Hw); box((Wd / 2 + MY) / 2, Wd / 2 - MY, Hw / 2, Hw); }
  const fx = new THREE.Group(); sc.add(fx);
  const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 80); cam.layers.enable(1);
  const eyeCam = new THREE.PerspectiveCamera(40, 360 / 270, 0.05, 80);
  let az = 1.2, el = 0.75, zoom = 1, drag = null, key = "";
  cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, az, el]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!drag) return; az = Math.max(-1.45, Math.min(1.45, drag[2] - (e.clientX - drag[0]) * 0.006)); el = Math.max(0.05, Math.min(1.5, drag[3] + (e.clientY - drag[1]) * 0.005)); });
  cv.addEventListener("pointerup", () => drag = null);
  cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.5, Math.min(2, zoom * (1 + e.deltaY * 0.001))); }, { passive: false });
  $("bTop").onclick = () => { az = Math.PI / 2; el = 1.5; };
  const Vt = (x, y, h) => new THREE.Vector3(x, h ?? EYE, -y);
  const Bm = (c, o) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o || {}));
  function tube(a, b, col) { fx.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 1, 0.012, 8, false), Bm(col))); }
  function dsh(a, b, col, r, over) {
    const L = a.distanceTo(b), n = Math.max(1, Math.round(L / 0.1)), m = Bm(col, { depthTest: !over, transparent: !!over });
    for (let i = 0; i < n; i++) { const u0 = i / n, u1 = u0 + 0.6 / n, c = new THREE.Mesh(new THREE.CylinderGeometry(r || 0.009, r || 0.009, L * (u1 - u0), 6), m);
      c.position.copy(a.clone().lerp(b, (u0 + u1) / 2)); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); if (over) c.renderOrder = 5; fx.add(c); }
  }
  function label(text, col, pos, s) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 96; const x = c.getContext("2d");
    x.font = "600 54px 'IBM Plex Sans Thai'"; const w = x.measureText(text).width;
    x.fillStyle = "rgba(15,23,42,.88)"; x.fillRect(256 - w / 2 - 14, 10, w + 28, 76); x.fillStyle = col; x.textAlign = "center"; x.fillText(text, 256, 68);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false })); sp.scale.set(s * 5.33, s, 1); sp.position.copy(pos); sp.renderOrder = 6; fx.add(sp);
  }
  function rebuild() {
    const k2 = [S.stage, S.sub, S.tShow.toFixed(3), S.t].join("|"); if (k2 === key) return; key = k2;
    fx.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } }); fx.clear();
    if (S.stage >= 1) for (let k = 0; k <= S.t; k++) { if (k > S.tShow + 1e-6) continue; const x = X0 - V * k;
      for (const s of [1, -1]) { const d = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.01, 16), Bm(s > 0 ? 0xb45309 : 0x78716c, { depthTest: false, transparent: true })); d.position.set(s * x, 0.01, 0.62); d.renderOrder = 4; fx.add(d); } }
    if (S.stage >= 2) {                                              /* ไม้บรรทัดบนพื้นวัดจากกระจก */
      const ru = new THREE.Mesh(new THREE.BoxGeometry(7, 0.01, 0.26), Bm(0xfde68a, { depthTest: false, transparent: true })); ru.position.set(0, 0.012, 1.05); ru.renderOrder = 4; fx.add(ru);
      for (let v = -3.5; v <= 3.5001; v += 0.5) { const t = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.012, 0.12), Bm(0x78350f, { depthTest: false, transparent: true })); t.position.set(v, 0.02, 0.98); t.renderOrder = 5; fx.add(t); label(f1(Math.abs(v)), "#fde68a", new THREE.Vector3(v, 0.08, 1.3), 0.15); }
      for (const x of [xe(), -xe()]) dsh(Vt(x, 0), new THREE.Vector3(x, 0.02, 0.98), 0x16a34a, 0.01, true);
    }
    const k = RS(), E = Vt(xe(), 0);
    const ray = (s, col, k0) => { if (k < k0) return; const yh = s * (xe() / (xe() + xp())), Q = Vt(0, yh), Sh = Vt(xp(), s, EYE - 0.25);
      tube(Sh, Q, col); if (k >= k0 + 1) { dsh(Q, Vt(0.6, yh), 0x0f172a); label("N", "#f8fafc", Vt(0.72, yh, EYE + 0.08), 0.14); } if (k >= k0 + 2) tube(Q, E, col); if (k >= 7) dsh(Q, Vt(-xp(), s, EYE - 0.25), col, 0.008, true); };
    ray(SH, 0xfb923c, 1); ray(-SH, 0xf472b6, 4);
    if (k >= 8) { label(`${f1(xe())} m`, "#fbbf24", Vt(xe() / 2, 0.75, 2.05), 0.2); label(`${f1(xe())} m`, "#fbbf24", Vt(-xe() / 2, 0.75, 2.05), 0.2); label(`ตา–ภาพ ${f1(2 * xe())} m`, "#4ade80", Vt(0, 0.75, 2.35), 0.22); }
  }
  T = {
    render() {
      const r = cv.getBoundingClientRect(); if (!r.width) return;
      R.setSize(r.width, r.height, false);
      realP.G.position.set(xp(), 0, 0); virtP.G.position.set(xp(), 0, 0); rebuild();
      wallMat.opacity = S.stage >= 2 ? 0.25 : 1; wallMat.depthWrite = S.stage < 2;   /* อ่านค่าเป็นต้นไป ผนังโปร่งให้เห็นภาพและไม้บรรทัด */
      const tgt = new THREE.Vector3(0, 0.8, 0.2), dist = 8.2 * zoom;           /* จุดเล็งและระยะคงที่ */
      cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
      cam.position.set(tgt.x + dist * Math.cos(el) * Math.cos(az), tgt.y + dist * Math.sin(el), tgt.z + dist * Math.cos(el) * Math.sin(az));
      cam.up.set(0, el > 1.45 ? 0 : 1, el > 1.45 ? -1 : 0); cam.lookAt(tgt); R.render(sc, cam);
    },
    eye(cv2) {
      realP.G.position.set(xp(), 0, 0); virtP.G.position.set(xp(), 0, 0);
      eyeCam.position.set(xe() - 0.02, EYE, 0); eyeCam.lookAt(0, 1.3, 0);
      const op = wallMat.opacity, dw = wallMat.depthWrite, fv = fx.visible; wallMat.opacity = 1; wallMat.depthWrite = true; fx.visible = false;
      eyeR.render(sc, eyeCam); wallMat.opacity = op; wallMat.depthWrite = dw; fx.visible = fv;
      cv2.getContext("2d").drawImage(eyeR.domElement, 0, 0, cv2.width, cv2.height);
    }
  };
}

/* ===== สลับโหมดและลูปหลัก ===== */
function setMode(m) {
  if (m === "3d" && !T) init3D();
  if (m === "3d" && !T) return;
  S.mode = m; $("b2d").classList.toggle("on", m === "2d"); $("b3d").classList.toggle("on", m === "3d");
  $("c2d").style.display = m === "2d" ? "block" : "none"; $("c3d").style.display = m === "3d" ? "block" : "none";
  $("bTop").style.display = m === "3d" ? "inline-block" : "none";
}
function loop(now) {
  tickAnim(now);
  $("clock").textContent = `t = ${Math.floor(S.tShow + 1e-6)} s`;
  $("inset").style.display = S.stage >= 1 ? "block" : "none"; $("wait").style.display = S.stage >= 1 ? "none" : "block";
  if (S.mode === "2d") { draw2D(); if (S.stage >= 1) drawEye2D($("eyeV")); }
  else if (T) { if (S.stage >= 1) T.eye($("eyeV")); T.render(); }
  requestAnimationFrame(loop);
}
buildSteps(); updateReadout(); requestAnimationFrame(loop);
</script>
