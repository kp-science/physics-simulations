<style>
/* KP Science · POE ตัวเล่นหน้าห้อง · แผน 1 รอบ 1

:root{--bg:#06090f;--panel:#0d1420;--line:#1e2a3d;--txt:#e6edf6;--mute:#8b9bb4;
  --accent:#38bdf8;--accent2:#a78bfa;--accent3:#4ade80;--accent4:#fb923c;--accent5:#f472b6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Thai Looped',sans-serif}
.app{display:flex;flex-direction:column;height:calc(100vh - 50px);min-height:520px}  /* 50px = แถบ KP ด้านบน */
body.clean nav[class^="kp-top"]{display:none}  /* ห้ามเขียนชื่อคลาสแถบ KP ตรง ๆ ที่นี่ protect script จะคิดว่ามีแถบแล้ว */

header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line)}
header .tag{font-family:'IBM Plex Sans Thai';font-weight:600;font-size:15px;color:var(--bg);background:var(--accent);padding:3px 12px;border-radius:999px}
header h1{font-family:'IBM Plex Sans Thai';font-weight:700;font-size:clamp(20px,2.4vw,34px);letter-spacing:.2px}
header .sp{flex:1}
.main{flex:1;min-height:0;display:flex}
.stage-wrap{position:relative;flex:1;min-width:0}
.side{width:clamp(220px,24vw,340px);border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px;justify-content:center}
#c2d,#c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.side .box{background:#0b111cdd;border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px}
.side .cap{font-family:'IBM Plex Sans Thai';font-size:clamp(14px,1.3vw,20px);color:var(--mute);margin-bottom:6px;text-align:center}
.side canvas{display:block;width:100%;height:auto;border-radius:8px;background:#000}
.side .wait{color:var(--mute);text-align:center;font-family:'IBM Plex Sans Thai';font-size:18px}
.readout{position:absolute;left:50%;transform:translateX(-50%);top:10px;white-space:nowrap;background:#0b111ce6;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-family:'Share Tech Mono',monospace;font-size:clamp(18px,1.9vw,30px);line-height:1.45;display:none}
.readout b{color:var(--accent3);font-weight:400}
.bar{display:flex;flex-direction:column;gap:6px;padding:8px 16px;border-top:1px solid var(--line)}
/* แถบปุ่มสูงคงที่ 2 แถวทุกขั้น ฉากจึงไม่ย่อ-ขยายตามความยาวป้ายขั้น (มาตราส่วนคงที่) */

.step{white-space:nowrap}
.btn{font-family:'IBM Plex Sans Thai';font-size:17px;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#04121c;border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.35;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn.on{background:#16324a;color:var(--accent)}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.step.on{color:#04121c;background:var(--accent4);border-color:var(--accent4);font-weight:600}
.step.done{color:var(--txt)}
.ctl{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mute)}
.ctl input{width:140px;accent-color:var(--accent)}
.ctl .v{font-family:'Share Tech Mono';color:var(--txt);min-width:52px}

      <div class="box"><div class="cap" id="capA">มองจากตา ที่ 1.0 m</div><canvas id="eyeA" width="260" height="200"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(typeof THREE==="undefined"){ document.write('<script src="../../_shared/three.min.js"><\/script>'); }</script>
<script>
/* ===== ค่าคงที่ของฉาก (ตรงกับสิมเดิมในไฟล์แผน 1: ขอบบนกระจก 1.45 m · ตา 1.6 m · คนสูง 1.7 m) ===== */
const MT = 1.45, EYE = 1.60, H = 1.70, MW = 0.40;       /* MW = ความกว้างกระจก (แนวราบ) */
const FACE = 0.09;                                     /* ระยะจากแกนตัวถึงหน้า/ตา */
const STAGES = ["ฉากก่อนผล", "เล่น", "อ่านค่า", "รังสีทีละเส้น"];
/* ขั้นรังสีแสดงทีละเส้น · ทุกจุดสะท้อนมีเส้นปกติเสมอ (ครูกำหนด 28 ก.ย. 2569) */
const RAYSTEPS = ["รังสีตกกระทบ 1", "เส้นปกติ 1", "รังสีสะท้อน 1", "รังสีตกกระทบ 2", "เส้นปกติ 2", "รังสีสะท้อน 2", "แนวต่อ · ภาพ"];
const S = { stage: 0, sub: 0, d: 1, mh: 0.30, anim: null, mode: "2d" };
const RS = () => S.stage === 3 ? S.sub : 0, IMG = () => RS() >= RAYSTEPS.length;
const mb = () => +(MT - S.mh).toFixed(2);
const seenLo = () => 2 * mb() - EYE, seenHi = () => 2 * MT - EYE;   /* จุดบนตัวที่รังสีสะท้อนเข้าตา: h = 2m − ความสูงตา */
const $ = id => document.getElementById(id);

/* ===== แถบขั้นและปุ่ม ===== */
function buildSteps() {
  $("steps").innerHTML = STAGES.map((t, i) => `<span class="step ${i === S.stage ? "on" : i < S.stage ? "done" : ""}">${i + 1} ${t}${i === 3 && S.stage === 3 ? ` · ${RAYSTEPS[S.sub - 1]} (${S.sub}/${RAYSTEPS.length})` : ""}</span>`).join("");
  const last = S.stage === 3 && S.sub === RAYSTEPS.length;
  $("bPrev").disabled = S.stage === 0; $("bNext").disabled = last; $("bRay").disabled = last;
  const lock = S.stage < 1 || !!S.anim;
  $("sD").disabled = lock; $("sM").disabled = S.stage < 2;
}
function setStage(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === S.stage) return;
  const prev = S.stage; S.stage = n; S.sub = n === 3 ? (prev < 3 ? 1 : S.sub) : 0;
  if (n === 0) { S.anim = null; S.d = 1; S.mh = 0.30; syncSliders(); }
  if (n === 1 && prev === 0) startWalk();
  if (n < 2) { S.mh = 0.30; syncSliders(); }
  buildSteps(); updateReadout();
}
function syncSliders() { $("sD").value = S.d; $("sM").value = S.mh; $("vD").textContent = S.d.toFixed(1) + " m"; $("vM").textContent = S.mh.toFixed(2) + " m"; }
function startWalk() { S.anim = { t0: performance.now(), from: S.d, to: 3, dur: 3200 }; }
function tickAnim(now) {
  if (!S.anim) return;
  const a = S.anim, u = Math.min(1, (now - a.t0) / a.dur), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  S.d = a.from + (a.to - a.from) * e; $("vD").textContent = S.d.toFixed(1) + " m";
  if (u >= 1) { S.d = a.to; S.anim = null; syncSliders(); buildSteps(); }
}
function updateReadout() {
  const r = $("readout");
  if (S.stage < 2 || IMG()) { r.style.display = "none"; return; }  /* ขั้นแนวต่อซ่อนไว้ไม่ให้บังฝั่งภาพ ค่ายังอ่านได้จากไม้บรรทัด */
  r.style.display = "block";
  r.innerHTML = `ส่วนที่เห็น <b>${seenLo().toFixed(2)}–${seenHi().toFixed(2)} m</b> · ยาว <b>${(seenHi() - seenLo()).toFixed(2)} m</b>`;
}
function next() { if (S.stage === 3) { if (S.sub < RAYSTEPS.length) { S.sub++; buildSteps(); updateReadout(); } } else setStage(S.stage + 1); }
function prev() { if (S.stage === 3 && S.sub > 1) { S.sub--; buildSteps(); updateReadout(); } else setStage(S.stage - 1); }
$("bNext").onclick = next; $("bPrev").onclick = prev;
$("bRay").onclick = () => S.stage < 3 ? setStage(3) : next();
$("sD").oninput = e => { S.d = +e.target.value; syncSliders(); updateReadout(); };
$("sM").oninput = e => { S.mh = +e.target.value; syncSliders(); updateReadout(); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$("b2d").onclick = () => setMode("2d"); $("b3d").onclick = () => setMode("3d");
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "r" || e.key === "R") setStage(Math.max(S.stage, 2));
  else if (e.key === "n" || e.key === "N") $("bRay").click();
  else if (e.key === "d" || e.key === "D") setMode(S.mode === "2d" ? "3d" : "2d");
  else if (e.key === "f" || e.key === "F") $("bFull").click();
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
});

/* ===== 2D: มองด้านข้าง ===== */
const c2 = $("c2d"), g = c2.getContext("2d");
let view = { x0: -0.35, x1: 4.4 };
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  return { w: cv.width, h: cv.height, dpr };
}
function draw2D() {
  const { w, h, dpr } = fit(c2);
  /* มาตราส่วนคงที่ (ครูขอ 28 ก.ย. 2569): กรอบครอบระยะ 1–3 m ไว้ตั้งแต่แรก คนเดินแล้วฉากไม่ซูมตาม
     ขั้นแนวต่อ·ภาพ ใช้กรอบกว้างอีกกรอบหนึ่ง (ต้องเห็นภาพหลังกระจกได้ถึง 3 m) เปลี่ยนครั้งเดียวตอนกดเข้าขั้นนั้น */
  view = IMG() ? { x0: -3.4, x1: 4.4 } : { x0: -0.35, x1: 4.4 };
  const y0 = -0.12, y1 = 2.25, sc = Math.min(w / (view.x1 - view.x0), h / (y1 - y0)) * 0.96;
  const ox = (w - (view.x1 - view.x0) * sc) / 2 - view.x0 * sc, oy = h - (h - (y1 - y0) * sc) / 2 + y0 * sc;
  const X = x => ox + x * sc, Y = y => oy - y * sc, px = v => v * dpr;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  /* พื้นห้องและผนังฝั่งจริง */
  const grd = g.createLinearGradient(0, Y(2.2), 0, Y(0)); grd.addColorStop(0, "#101a2a"); grd.addColorStop(1, "#15233a");
  g.fillStyle = grd; g.fillRect(X(0), Y(2.2), X(view.x1 + 1) - X(0), Y(0) - Y(2.2));
  g.fillStyle = "#3a2a1c"; g.fillRect(X(0), Y(0), X(view.x1 + 1) - X(0), px(14));
  for (let x = 0; x < view.x1 + 1; x += 0.3) { g.strokeStyle = "#4a3726"; g.lineWidth = px(1); g.beginPath(); g.moveTo(X(x), Y(0)); g.lineTo(X(x), Y(0) + px(14)); g.stroke(); }
  /* ฝั่งภาพเสมือน (หลังกระจก) — แสดงเมื่อถึงขั้นแนวต่อ */
  if (IMG()) {
    g.fillStyle = "#0b1320"; g.fillRect(X(view.x0 - 1), Y(2.2), X(0) - X(view.x0 - 1), Y(0) - Y(2.2) + px(14));
    g.setLineDash([px(6), px(6)]); g.strokeStyle = "#2b3b55"; g.lineWidth = px(1.5);
    g.beginPath(); g.moveTo(X(view.x0 - 1), Y(0)); g.lineTo(X(0), Y(0)); g.stroke(); g.setLineDash([]);
    g.fillStyle = "#8b9bb4"; g.font = `${px(18)}px 'IBM Plex Sans Thai'`; g.textAlign = "center";
    g.fillText("หลังกระจก (ภาพ)", X(-S.d * 0.5), Y(1.95));
  }
  /* ผนังและกระจก */
  g.fillStyle = "#26344a"; g.fillRect(X(0) - px(16), Y(2.2), px(16), Y(0) - Y(2.2) + px(14));
  g.fillStyle = "#b9c7d8"; g.fillRect(X(0) - px(3), Y(MT) - px(4), px(7), Y(mb()) - Y(MT) + px(8));        /* กรอบ */
  const mg = g.createLinearGradient(X(0), 0, X(0) + px(6), 0); mg.addColorStop(0, "#9fdcff"); mg.addColorStop(1, "#e8f7ff");
  g.fillStyle = mg; g.fillRect(X(0), Y(MT), px(5), Y(mb()) - Y(MT));
  /* เทปบนพื้นบอกตำแหน่ง 1 m และ 3 m (เป็นเงื่อนไขในโจทย์ ไม่ใช่ผล) */
  g.font = `${px(20)}px 'IBM Plex Sans Thai'`; g.textAlign = "center";
  for (const t of [1, 3]) { g.fillStyle = "#fbbf24"; g.fillRect(X(t - FACE) - px(3), Y(0) - px(2), px(6), px(8)); g.fillText(t + " m", X(t - FACE), Y(0) + px(36)); }
  /* ภาพเสมือนของคน */
  if (IMG()) person2D(X, Y, sc, px, -S.d, +1, true);
  person2D(X, Y, sc, px, S.d, -1, false);
  const xe = S.d - FACE;
  /* แถบส่วนที่เห็น + ไม้บรรทัด (อ่านค่า) */
  if (S.stage >= 2) {
    const lo = seenLo(), hi = seenHi();
    g.fillStyle = "rgba(74,222,128,.28)"; g.fillRect(X(xe) - px(4), Y(hi), X(S.d + 0.16) - X(xe) + px(4), Y(lo) - Y(hi));
    g.strokeStyle = "#4ade80"; g.lineWidth = px(3); g.beginPath(); g.moveTo(X(xe), Y(hi)); g.lineTo(X(xe), Y(lo)); g.stroke();
    ruler(X, Y, px, S.d + 0.42, lo, hi);
  }
  /* รังสี: จากจุดบนตัว → ขอบกระจก → ตา */

    },
    eye(cv2, d) {                                                   /* เรนเดอร์มุมมองจากตาลงแคนวาสเล็ก */
      const keep = S.d; S.d = d; real.G.position.set(d, 0, 0); img.G.position.set(d, 0, 0);
      eyeCam.position.set(d - FACE - 0.02, EYE, 0); eyeCam.lookAt(0, (MT + mb()) / 2, 0);
      eyeCam.updateProjectionMatrix();
      const rv = rayG.visible; rayG.visible = false;
      const op = wallMat.opacity, dw = wallMat.depthWrite; wallMat.opacity = 1; wallMat.depthWrite = true;   /* ตามองผ่านกระจกเท่านั้น */
      eyeR.render(sc, eyeCam);
      wallMat.opacity = op; wallMat.depthWrite = dw;
      cv2.getContext("2d").drawImage(eyeR.domElement, 0, 0, cv2.width, cv2.height);
      rayG.visible = rv; S.d = keep;
    }
  };
}

/* ===== สลับโหมดและลูปหลัก ===== */
function setMode(m) {
  if (m === "3d" && !T) init3D();
  if (m === "3d" && !T) return;
  S.mode = m; $("b2d").classList.toggle("on", m === "2d"); $("b3d").classList.toggle("on", m === "3d");
  $("c2d").style.display = m === "2d" ? "block" : "none"; $("c3d").style.display = m === "3d" ? "block" : "none";
}
function loop(now) {
  tickAnim(now);
  $("inset").style.display = S.stage >= 1 ? "flex" : "none"; $("wait").style.display = S.stage >= 1 ? "none" : "block";
  $("capB").textContent = "มองจากตา ที่ " + S.d.toFixed(1) + " m";
  if (S.mode === "2d") { draw2D(); if (S.stage >= 1) { drawEye($("eyeA"), 1); drawEye($("eyeB"), S.d); } }
  else if (T) {
    if (S.stage >= 1) { T.eye($("eyeA"), 1); T.eye($("eyeB"), S.d); }
    T.render();
  }
  requestAnimationFrame(loop);
}
syncSliders(); buildSteps(); updateReadout(); requestAnimationFrame(loop);
</script>
