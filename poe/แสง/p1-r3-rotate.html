<script>
/* ===== ค่าของฉาก (ตรงกับสิมเดิมในไฟล์แผน 1 · มองจากด้านบนของโต๊ะ · หน่วย ซม. · มุมวัดทวนเข็มจากแกน +x) =====
   จุดตกกระทบอยู่ที่จุดกำเนิด · กระจกเริ่มวางตามแกน x แล้วหมุนไป th · เส้นปกติชี้ 90° + th
   แสงตกกระทบมาจากทิศ 90° + i (คงที่) · รังสีสะท้อนชี้ 90° − i + 2th = ค่าที่อ่านบนโปรแทรกเตอร์ (ติดกระดาษ ไม่หมุนตามกระจก) */
const ML = 6, RB = 34, RR = 32, PR = 22;                   /* ครึ่งความยาวกระจก · ระยะกล่องแสง · ความยาวรังสีสะท้อน · รัศมีโปรแทรกเตอร์ */
const STAGES = ["ฉากก่อนผล", "เล่น", "อ่านค่า", "รังสีทีละเส้น"];
/* ขั้นรังสีแสดงทีละเส้น · ทุกจุดสะท้อนมีเส้นปกติเสมอ (ครูกำหนด 28 ก.ย. 2569) */
const RAYSTEPS = ["รังสีตกกระทบ", "เส้นปกติ (กระจก 0°)", "รังสีสะท้อน (กระจก 0°)", "เส้นปกติ (กระจกหมุน)", "รังสีสะท้อน (กระจกหมุน)", "มุมที่หมุน"];
const S = { stage: 0, sub: 0, th: 0, i: 30, anim: null, mode: "2d" };
const RS = () => S.stage === 3 ? S.sub : 0;
const rad = d => d * Math.PI / 180, dir = (a, L) => [L * Math.cos(rad(a)), L * Math.sin(rad(a))];
const refl = th => 90 - S.i + 2 * th;                      /* ทิศรังสีสะท้อน (องศาบนโปรแทรกเตอร์) */
const $ = id => document.getElementById(id);

/* ===== แถบขั้นและปุ่ม ===== */
function buildSteps() {
  $("steps").innerHTML = STAGES.map((t, k) => `<span class="step ${k === S.stage ? "on" : k < S.stage ? "done" : ""}">${k + 1} ${t}${k === 3 && S.stage === 3 ? ` · ${RAYSTEPS[S.sub - 1]} (${S.sub}/${RAYSTEPS.length})` : ""}</span>`).join("");
  const last = S.stage === 3 && S.sub === RAYSTEPS.length;
  $("bPrev").disabled = S.stage === 0; $("bNext").disabled = last; $("bRay").disabled = last;
  $("sT").disabled = S.stage < 1 || !!S.anim; $("sI").disabled = S.stage < 2;
}
function setStage(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === S.stage) return;
  const prev = S.stage; S.stage = n; S.sub = n === 3 ? (prev < 3 ? 1 : S.sub) : 0;
  if (n === 0) { S.anim = null; S.th = 0; S.i = 30; }
  if (n === 1 && prev === 0) S.anim = { t0: performance.now(), from: 0, to: 15, dur: 3000 };
  if (n < 2) S.i = 30;
  if (n === 3 && S.th === 0) S.th = 15;                    /* ขั้นรังสีต้องมีกระจกที่หมุนแล้วไว้เทียบ */
  syncSliders(); buildSteps(); updateReadout();
}
function next() { if (S.stage === 3) { if (S.sub < RAYSTEPS.length) { S.sub++; buildSteps(); } } else setStage(S.stage + 1); }
function prev() { if (S.stage === 3 && S.sub > 1) { S.sub--; buildSteps(); } else setStage(S.stage - 1); }
function syncSliders() { $("sT").value = S.th; $("sI").value = S.i; $("vT").textContent = Math.round(S.th) + "°"; $("vI").textContent = S.i + "°"; }
function tickAnim(now) {
  if (!S.anim) return;
  const a = S.anim, u = Math.min(1, (now - a.t0) / a.dur), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  S.th = a.from + (a.to - a.from) * e; $("vT").textContent = Math.round(S.th) + "°";
  if (u >= 1) { S.th = a.to; S.anim = null; syncSliders(); buildSteps(); }
}
/* อ่านค่า: บอกเฉพาะมุมที่ครูหมุนกระจก · ตำแหน่งรังสีสะท้อนให้นักเรียนอ่านเองจากโปรแทรกเตอร์ (งานในใบ O) */
function updateReadout() {
  const r = $("readout");
  if (S.stage < 2) { r.style.display = "none"; return; }
  r.style.display = "block"; r.innerHTML = `กระจกหมุน <b>${Math.round(S.th)}°</b>`;
}
$("bNext").onclick = next; $("bPrev").onclick = prev;
$("bRay").onclick = () => S.stage < 3 ? setStage(3) : next();
$("sT").oninput = e => { S.th = +e.target.value; syncSliders(); updateReadout(); };
$("sI").oninput = e => { S.i = +e.target.value; syncSliders(); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$("b2d").onclick = () => setMode("2d"); $("b3d").onclick = () => setMode("3d");
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "r" || e.key === "R") setStage(Math.max(S.stage, 2));
  else if (e.key === "n" || e.key === "N") $("bRay").click();
  else if (e.key === "d" || e.key === "D") setMode(S.mode === "2d" ? "3d" : "2d");
  else if (e.key === "f" || e.key === "F") $("bFull").click();
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
});

/* ===== 2D: มองจากด้านบนของโต๊ะ · มาตราส่วนคงที่ (กรอบครอบทุกค่าของตัวปรับ) ===== */
const c2 = $("c2d"), g = c2.getContext("2d");
const B2 = { x0: -40, x1: 40, y0: -14, y1: 38 };
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  return { w: cv.width, h: cv.height, dpr };
}
function draw2D() {
  const { w, h, dpr } = fit(c2), px = v => v * dpr;
  const sc = Math.min(w / (B2.x1 - B2.x0), h / (B2.y1 - B2.y0)) * 0.97;
  const ox = (w - (B2.x1 - B2.x0) * sc) / 2 - B2.x0 * sc, oy = (h - (B2.y1 - B2.y0) * sc) / 2 + B2.y1 * sc;
  const P = (x, y) => [ox + x * sc, oy - y * sc];
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  /* โต๊ะและกระดาษ */
  g.fillStyle = "#4a3526"; g.fillRect(0, 0, w, h);
  for (let y = -60; y < 60; y += 5) { const [, b] = P(0, y); g.strokeStyle = "#3d2b1f"; g.lineWidth = px(1); g.beginPath(); g.moveTo(0, b); g.lineTo(w, b); g.stroke(); }
  { const [a, b] = P(-36, 36), [c, d] = P(36, -12); g.fillStyle = "#f4f1e8"; g.fillRect(a, b, c - a, d - b); }
  /* แท่นหมุนใต้กระจก: สเกลหมุนตามกระจก ขีดชี้คงที่ */
  turntable(P, px, sc);
  if (S.stage >= 2) protractor(P, px, sc);
  const k = RS();
  if (S.stage < 3) {
    /* ลำแสงจริง (เรืองแสง) + เส้นปกติของกระจกเสมอ */
    beam(P(...dir(90 + S.i, RB)), P(0, 0), px);
    beam(P(0, 0), P(...dir(refl(S.th), RR)), px);
    if (S.stage >= 1 && S.th > 0.5) dashLine(P(0, 0), P(...dir(refl(0), RR)), "#f59e0b", px, 2);   /* ตำแหน่งรังสีสะท้อนตอนกระจก 0° */
    normal2D(P, px, 90 + S.th);
  } else {
    /* ขั้นรังสี: กระจก 0° เป็นเงาประ · กระจกที่หมุนแล้วเป็นของจริง */
    ghostMirror(P, px);
    seg(P(...dir(90 + S.i, RB)), P(0, 0), "#e11d48", px);
    if (k >= 2) normal2D(P, px, 90, "#fb923c");
    if (k >= 3) seg(P(0, 0), P(...dir(refl(0), RR)), "#fb923c", px);
    if (k >= 4) normal2D(P, px, 90 + S.th, "#f472b6");
    if (k >= 5) seg(P(0, 0), P(...dir(refl(S.th), RR)), "#f472b6", px);
    if (k >= 6) { arcMark(P, px, sc, 90, 90 + S.th, 13, "#0f172a", `${Math.round(S.th)}°`); arcMark(P, px, sc, refl(0), refl(S.th), 26, "#be185d", `${Math.round(2 * S.th)}°`); }
  }
  mirror2D(P, px, S.th);
  rayBox(P, px, sc);
}
function beam(a, b, px) {
  g.save(); g.lineCap = "round";
  g.strokeStyle = "rgba(239,68,68,.25)"; g.lineWidth = px(12); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  g.strokeStyle = "#ef4444"; g.lineWidth = px(3); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  g.restore();
}
function seg(a, b, col, px) {
  g.strokeStyle = col; g.lineWidth = px(3.4); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  const an = Math.atan2(b[1] - a[1], b[0] - a[0]), mx = a[0] + (b[0] - a[0]) * .55, my = a[1] + (b[1] - a[1]) * .55;
  g.save(); g.translate(mx, my); g.rotate(an); g.fillStyle = col; g.beginPath(); g.moveTo(px(11), 0); g.lineTo(-px(7), -px(7)); g.lineTo(-px(7), px(7)); g.closePath(); g.fill(); g.restore();
}
function dashLine(a, b, col, px, wd) { g.save(); g.strokeStyle = col; g.lineWidth = px(wd); g.setLineDash([px(8), px(7)]); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); g.restore(); }
/* เส้นปกติ: ตั้งฉากกับกระจก ณ จุดตกกระทบ + เครื่องหมายมุมฉาก + N */
function normal2D(P, px, ang, col) {
  col = col || "#0f172a";
  const L = 20, [a, b] = P(0, 0), [c, d] = P(...dir(ang, L));
  dashLine([a, b], [c, d], col, px, 2);
  const u = [(c - a) / Math.hypot(c - a, d - b), (d - b) / Math.hypot(c - a, d - b)], v = [-u[1], u[0]], q = px(11);
  g.save(); g.strokeStyle = col; g.lineWidth = px(1.5); g.beginPath(); g.moveTo(a + u[0] * q, b + u[1] * q); g.lineTo(a + (u[0] + v[0]) * q, b + (u[1] + v[1]) * q); g.lineTo(a + v[0] * q, b + v[1] * q); g.stroke();
  g.fillStyle = col; g.font = `600 ${px(18)}px 'IBM Plex Sans Thai'`; g.textAlign = "center"; g.fillText("N", c + u[0] * px(14), d + u[1] * px(14) + px(6)); g.restore();
}
function mirror2D(P, px, th) {
  const [a, b] = P(...dir(th, -ML)), [c, d] = P(...dir(th, ML)), n = dir(th + 90, 1);
  g.save(); g.lineCap = "butt";
  g.strokeStyle = "#64748b"; g.lineWidth = px(9); g.beginPath(); g.moveTo(a - n[0] * px(5), b + n[1] * px(5)); g.lineTo(c - n[0] * px(5), d + n[1] * px(5));   /* ด้านหลังกระจก = ฝั่งตรงข้ามเส้นปกติ */ g.stroke();
  g.strokeStyle = "#bae6fd"; g.lineWidth = px(4); g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke();
  g.restore();
}
function ghostMirror(P, px) { const [a, b] = P(-ML, 0), [c, d] = P(ML, 0); dashLine([a, b], [c, d], "#94a3b8", px, 3); }
function turntable(P, px, sc) {
  const [cx, cy] = P(0, 0), r = 9 * sc;
  g.save(); g.fillStyle = "#d6d3d1"; g.strokeStyle = "#57534e"; g.lineWidth = px(2); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.stroke();
  g.strokeStyle = "#57534e"; g.lineWidth = px(1);
  for (let a = 0; a < 360; a += 5) { const t = rad(a + S.th), L = a % 30 === 0 ? r * .2 : r * .1; g.beginPath(); g.moveTo(cx + Math.cos(t) * r, cy - Math.sin(t) * r); g.lineTo(cx + Math.cos(t) * (r - L), cy - Math.sin(t) * (r - L)); g.stroke(); }
  g.fillStyle = "#b91c1c"; g.beginPath(); g.moveTo(cx + r + px(2), cy); g.lineTo(cx + r + px(12), cy - px(6)); g.lineTo(cx + r + px(12), cy + px(6)); g.closePath(); g.fill();   /* ขีดชี้คงที่ */
  g.restore();
}
function rayBox(P, px, sc) {
  const [x, y] = P(...dir(90 + S.i, RB + 3)), a = -rad(90 + S.i);
  g.save(); g.translate(x, y); g.rotate(a);
  g.fillStyle = "#1f2937"; g.strokeStyle = "#0f172a"; g.lineWidth = px(2);
  g.fillRect(-4 * sc, -2.6 * sc, 8 * sc, 5.2 * sc); g.strokeRect(-4 * sc, -2.6 * sc, 8 * sc, 5.2 * sc);
  g.fillStyle = "#fde68a"; g.fillRect(-4.3 * sc, -0.35 * sc, 0.6 * sc, 0.7 * sc);
  g.restore();

function tag(t, x, y, px) {

  g.fillStyle = "rgba(15,23,42,.82)"; g.beginPath(); g.roundRect ? g.roundRect(x - px(6), y - px(18), w + px(12), px(25), px(6)) : g.rect(x - px(6), y - px(18), w + px(12), px(25)); g.fill();
  g.fillStyle = "#f8fafc"; g.fillText(t, x, y);
}
/* โปรแทรกเตอร์ครึ่งวงกลม ติดกระดาษ ศูนย์กลางที่จุดตกกระทบ 0° ทางขวา ขีดละ 1° ตัวเลขทุก 10° */
function protractor(P, px, sc) {
  const [cx, cy] = P(0, 0), r = PR * sc;
  g.save();
  g.fillStyle = "rgba(186,230,253,.28)"; g.strokeStyle = "#0369a1"; g.lineWidth = px(1.5);
  g.beginPath(); g.moveTo(cx - r, cy); g.arc(cx, cy, r, Math.PI, 2 * Math.PI); g.closePath(); g.fill(); g.stroke();
  for (let a = 0; a <= 180; a++) {
    const L = a % 10 === 0 ? r * .1 : a % 5 === 0 ? r * .065 : r * .035, t = rad(a);
    g.lineWidth = px(a % 5 ? 1 : 1.6); g.beginPath(); g.moveTo(cx + Math.cos(t) * r, cy - Math.sin(t) * r); g.lineTo(cx + Math.cos(t) * (r - L), cy - Math.sin(t) * (r - L)); g.stroke();
    if (a % 10 === 0) { g.fillStyle = "#075985"; g.font = `${px(15)}px 'Share Tech Mono'`; g.textAlign = "center"; g.fillText(String(a), cx + Math.cos(t) * (r - r * .17), cy - Math.sin(t) * (r - r * .17) + px(5)); }
  }
  g.restore();
}
function arcMark(P, px, sc, a0, a1, R, col, lab) {
  const [cx, cy] = P(0, 0), r = R * sc;
  g.save(); g.strokeStyle = col; g.lineWidth = px(2.5); g.beginPath(); g.arc(cx, cy, r, -rad(a1), -rad(a0)); g.stroke();
  const m = rad((a0 + a1) / 2); tag(lab, cx + Math.cos(m) * (r + px(10)), cy - Math.sin(m) * (r + px(10)) + px(6), px); g.restore();
}

/* ===== 3D: โต๊ะ กล่องแสง กระจกบนแท่นหมุน ลำแสงคำนวณจากกฎการสะท้อน ===== */
let T = null;
function init3D() {
  if (typeof THREE === "undefined") { $("b3d").disabled = true; return; }
  const cv = $("c3d"), R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  R.setPixelRatio(devicePixelRatio || 1); R.setClearColor(0x06090f);
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x3b2a1c, 0.8));
  const dl = new THREE.DirectionalLight(0xffffff, 0.5); dl.position.set(30, 90, 40); sc.add(dl);
  const L = c => new THREE.MeshLambertMaterial({ color: c }), Bm = (c, o) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o || {}));
  /* พิกัด 3D: x = x · y = ความสูง · z = −y ของโต๊ะ (มุมบนจึงวางเหมือนภาพ 2D) */
  const V = (x, y, h) => new THREE.Vector3(x, h ?? 1.5, -y), H = 1.5;
  const table = new THREE.Mesh(new THREE.BoxGeometry(160, 3, 110), L(0x4a3526)); table.position.y = -1.5; sc.add(table);
  const paper = new THREE.Mesh(new THREE.BoxGeometry(72, 0.1, 48), L(0xf4f1e8)); paper.position.set(0, 0.05, -12); sc.add(paper);
  const turn = new THREE.Group(); sc.add(turn);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 0.8, 48), L(0xd6d3d1)); disc.position.y = 0.4; turn.add(disc);
  for (let a = 0; a < 360; a += 10) { const t = new THREE.Mesh(new THREE.BoxGeometry(a % 30 ? 1 : 1.8, 0.05, 0.15), Bm(0x57534e)); t.position.set(Math.cos(rad(a)) * (a % 30 ? 8.5 : 8.1), 0.83, -Math.sin(rad(a)) * (a % 30 ? 8.5 : 8.1)); t.rotation.y = rad(a); turn.add(t); }
  const glass = new THREE.Mesh(new THREE.BoxGeometry(2 * ML, 6, 0.5), new THREE.MeshPhongMaterial({ color: 0xbae6fd, shininess: 120, specular: 0xffffff })); glass.position.set(0, 3.8, 0); turn.add(glass);
  const backM = new THREE.Mesh(new THREE.BoxGeometry(2 * ML, 6, 0.3), L(0x64748b)); backM.position.set(0, 3.8, 0.4); turn.add(backM);
  const ptr = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 12), Bm(0xb91c1c)); ptr.rotation.z = Math.PI / 2; ptr.position.set(10.5, 0.8, 0); sc.add(ptr);
  const box = new THREE.Group(); sc.add(box);
  const bb = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 5.2), L(0x1f2937)); bb.position.y = 2.5; box.add(bb);
  const slit = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.8), Bm(0xfde68a)); slit.position.set(-4.05, H, 0); box.add(slit);
  /* โปรแทรกเตอร์: แผ่นครึ่งวงกลมโปร่ง ลายจาก canvas */
  const pc = document.createElement("canvas"); pc.width = 1024; pc.height = 1024; const px2 = pc.getContext("2d");
  { const c = 512, r = 500; px2.fillStyle = "rgba(186,230,253,.45)"; px2.beginPath(); px2.moveTo(c - r, c); px2.arc(c, c, r, Math.PI, 2 * Math.PI); px2.closePath(); px2.fill();
    px2.strokeStyle = "#075985"; px2.fillStyle = "#075985"; px2.textAlign = "center"; px2.font = "30px 'Share Tech Mono'";
    for (let a = 0; a <= 180; a++) { const t = rad(a), Lk = a % 10 === 0 ? 55 : a % 5 === 0 ? 36 : 20; px2.lineWidth = a % 5 ? 2 : 4; px2.beginPath(); px2.moveTo(c + Math.cos(t) * r, c - Math.sin(t) * r); px2.lineTo(c + Math.cos(t) * (r - Lk), c - Math.sin(t) * (r - Lk)); px2.stroke();
      if (a % 10 === 0) px2.fillText(String(a), c + Math.cos(t) * (r - 90), c - Math.sin(t) * (r - 90) + 10); } }
  const prot = new THREE.Mesh(new THREE.PlaneGeometry(2 * PR, 2 * PR), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc), transparent: true, depthWrite: false }));
  prot.rotation.x = -Math.PI / 2; prot.position.set(0, 0.95, 0); sc.add(prot);
  const fx = new THREE.Group(); sc.add(fx);
  const cam = new THREE.PerspectiveCamera(40, 1, 1, 2000);
  let az = Math.PI / 2, el = 0.95, zoom = 1, drag = null, key = "";   /* มองจากหน้าโต๊ะ ซ้าย-ขวาตรงกับภาพ 2D */
  cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, az, el]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!drag) return; az = drag[2] - (e.clientX - drag[0]) * 0.006; el = Math.max(0.08, Math.min(1.5, drag[3] + (e.clientY - drag[1]) * 0.005)); });
  cv.addEventListener("pointerup", () => drag = null);
  cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.5, Math.min(2, zoom * (1 + e.deltaY * 0.001))); }, { passive: false });
  $("bTop").onclick = () => { az = Math.PI / 2; el = 1.5; };
  function tube(a, b, col, r, glow) {
    const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 1, r || 0.3, 10, false), Bm(col)); fx.add(m);
    if (glow) fx.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 1, 1.1, 10, false), Bm(col, { transparent: true, opacity: 0.22, depthWrite: false })));
  }
  function cone(a, b, col) { const c = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.6, 12), Bm(col)); c.position.copy(a.clone().lerp(b, 0.55)); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); fx.add(c); }
  function dash(a, b, col, r) {
    const Ln = a.distanceTo(b), n = Math.max(1, Math.round(Ln / 1.8)), m = Bm(col);
    for (let k = 0; k < n; k++) { const u0 = k / n, u1 = u0 + 0.6 / n, c = new THREE.Mesh(new THREE.CylinderGeometry(r || 0.22, r || 0.22, Ln * (u1 - u0), 6), m);
      c.position.copy(a.clone().lerp(b, (u0 + u1) / 2)); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); fx.add(c); }
  }
  function label(text, col, pos, s) {
    const c = document.createElement("canvas"); c.width = 256; c.height = 80; const x = c.getContext("2d");
    x.fillStyle = "rgba(15,23,42,.85)"; x.fillRect(40, 8, 176, 64); x.font = "600 46px 'IBM Plex Sans Thai'"; x.fillStyle = col; x.textAlign = "center"; x.fillText(text, 128, 57);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false })); sp.scale.set(s * 3.2, s, 1); sp.position.copy(pos); sp.renderOrder = 6; fx.add(sp);
  }
  function normal3(ang, col) { const E = V(...dir(ang, 20)); dash(V(0, 0), E, col); label("N", "#f8fafc", V(...dir(ang, 23), 3), 3); }
  function rebuild() {
    const k2 = [S.stage, S.sub, S.th.toFixed(2), S.i].join("|"); if (k2 === key) return; key = k2;
    fx.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } }); fx.clear();
    const src = V(...dir(90 + S.i, RB - 4)), O = V(0, 0), k = RS();
    if (S.stage < 3) {
      tube(src, O, 0xef4444, 0.3, true); tube(O, V(...dir(refl(S.th), RR)), 0xef4444, 0.3, true);
      if (S.stage >= 1 && S.th > 0.5) dash(O, V(...dir(refl(0), RR)), 0xf59e0b, 0.2);
      normal3(90 + S.th, 0x0f172a);
    } else {
      dash(V(-ML, 0, 3.8), V(ML, 0, 3.8), 0x94a3b8, 0.25);             /* กระจกตอน 0° */
      tube(src, O, 0xe11d48); cone(src, O, 0xe11d48);
      if (k >= 2) normal3(90, 0xfb923c);
      if (k >= 3) { const E = V(...dir(refl(0), RR)); tube(O, E, 0xfb923c); cone(O, E, 0xfb923c); }
      if (k >= 4) normal3(90 + S.th, 0xf472b6);
      if (k >= 5) { const E = V(...dir(refl(S.th), RR)); tube(O, E, 0xf472b6); cone(O, E, 0xf472b6); }
      if (k >= 6) { label(`${Math.round(S.th)}°`, "#f8fafc", V(...dir(90 + S.th / 2, 11), 3), 3.2); label(`${Math.round(2 * S.th)}°`, "#f9a8d4", V(...dir(refl(S.th / 2), 27), 3), 3.2); }
    }
  }
  T = {
    render() {
      const r = cv.getBoundingClientRect(); if (!r.width) return;
      R.setSize(r.width, r.height, false);
      turn.rotation.y = rad(S.th); prot.visible = S.stage >= 2;
      const bp = dir(90 + S.i, RB + 3); box.position.set(bp[0], 0, -bp[1]); box.rotation.y = rad(90 + S.i);   /* ช่องแสง (−x ของกล่อง) หันเข้าหาจุดตกกระทบ */
      rebuild();
      const tgt = new THREE.Vector3(0, 0, -12), dist = 105 * zoom;          /* จุดเล็งและระยะคงที่ */
      cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
      cam.position.set(tgt.x + dist * Math.cos(el) * Math.cos(az), tgt.y + dist * Math.sin(el), tgt.z + dist * Math.cos(el) * Math.sin(az));
      cam.up.set(0, el > 1.45 ? 0 : 1, el > 1.45 ? -1 : 0); cam.lookAt(tgt); R.render(sc, cam);
    }
  };
}

/* ===== สลับโหมดและลูปหลัก ===== */
function setMode(m) {
  if (m === "3d" && !T) init3D();
  if (m === "3d" && !T) return;
  S.mode = m; $("b2d").classList.toggle("on", m === "2d"); $("b3d").classList.toggle("on", m === "3d");
  $("c2d").style.display = m === "2d" ? "block" : "none"; $("c3d").style.display = m === "3d" ? "block" : "none";
  $("bTop").style.display = m === "3d" ? "inline-block" : "none";
}
function loop(now) {
  tickAnim(now);
  if (S.mode === "2d") draw2D(); else if (T) T.render();
  requestAnimationFrame(loop);
}
syncSliders(); buildSteps(); updateReadout(); requestAnimationFrame(loop);
</script>
