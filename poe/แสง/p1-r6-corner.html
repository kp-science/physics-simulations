<script>
/* ===== ค่าของฉาก (มองจากด้านบนของโต๊ะ · หน่วย ซม.) =====
   กระจก 1 บนเส้น x = 0 (y 0–50) · กระจก 2 บนเส้น y = 0 (x 0–50) มุมกระจกที่จุดกำเนิด
   ปากกาที่ (px, py) ค่าเริ่ม (20, 30) ตามสิมเดิม · ภาพ 1 (−px, py) จากกระจก 1 · ภาพ 2 (px, −py) จากกระจก 2 · ภาพ 3 (−px, −py) สะท้อนสองครั้ง
   [ออกแบบ] กระจก 2 สั้นลงจาก 90 เป็น 50 ซม. (เท่าบาน 1) ให้มุมมองจากตาไม่มีปลายกระจกอยู่ข้างตา · ตาอยู่ที่ (60, 45) เห็นครบ 3 ภาพทุกค่าตัวปรับ (ตรวจ 10–40 ทุกคู่) */
const ML = 50, EX = 60, EY = 45, HE = 5, MH = 10, PH = 12;
const STAGES = ["ฉากก่อนผล", "เล่น", "อ่านค่า", "รังสีทีละเส้น"];
/* ขั้นรังสีแสดงทีละเส้น · ทุกจุดสะท้อนมีเส้นปกติเสมอ (ครูกำหนด 28 ก.ย. 2569) */
const RAYSTEPS = ["ภาพ 1: รังสีตกกระทบ", "ภาพ 1: เส้นปกติ", "ภาพ 1: รังสีสะท้อน", "ภาพ 1: แนวต่อ",
                  "ภาพ 2: รังสีตกกระทบ", "ภาพ 2: เส้นปกติ", "ภาพ 2: รังสีสะท้อน", "ภาพ 2: แนวต่อ",
                  "ภาพ 3: รังสีตกกระทบ", "ภาพ 3: เส้นปกติครั้งแรก", "ภาพ 3: สะท้อนครั้งแรก", "ภาพ 3: เส้นปกติครั้งที่สอง", "ภาพ 3: สะท้อนครั้งที่สอง", "ภาพ 3: แนวต่อ"];
const S = { stage: 0, sub: 0, px: 20, py: 30, mode: "2d" };
const RS = () => S.stage === 3 ? S.sub : 0;
const $ = id => document.getElementById(id);
const IMGS = () => [[-S.px, S.py, "ภาพ 1"], [S.px, -S.py, "ภาพ 2"], [-S.px, -S.py, "ภาพ 3"]];
/* เส้นทางแสงจริงจากปากกาถึงตา (คำนวณจากการคลี่ภาพ) */
function paths() {
  const E = [EX, EY], P = [S.px, S.py];
  const cut = (a, b, axis) => { const t = (0 - a[axis]) / (b[axis] - a[axis]); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; };
  const p1 = cut(E, [-S.px, S.py], 0), p2 = cut(E, [S.px, -S.py], 1);
  const I3 = [-S.px, -S.py], tx = EX / (EX + S.px), ty = EY / (EY + S.py);
  let last, first, firstMirror;
  if (ty < tx) { last = cut(E, I3, 1); first = cut(last, [-S.px, S.py], 0); firstMirror = 1; }   /* ปากกา → กระจก 1 → กระจก 2 → ตา */
  else { last = cut(E, I3, 0); first = cut(last, [S.px, -S.py], 1); firstMirror = 2; }          /* ปากกา → กระจก 2 → กระจก 1 → ตา */
  const on = (q, ax) => q[1 - ax] >= -0.01 && q[1 - ax] <= ML + 0.01;
  return { P, E, r1: on(p1, 0) ? p1 : null, r2: on(p2, 1) ? p2 : null,
           r3: on(first, firstMirror === 1 ? 0 : 1) && on(last, firstMirror === 1 ? 1 : 0) ? { first, last, firstMirror } : null };
}

/* ===== แถบขั้นและปุ่ม ===== */
function buildSteps() {
  $("steps").innerHTML = STAGES.map((t, k) => `<span class="step ${k === S.stage ? "on" : k < S.stage ? "done" : ""}">${k + 1} ${t}${k === 3 && S.stage === 3 ? ` · ${RAYSTEPS[S.sub - 1]} (${S.sub}/${RAYSTEPS.length})` : ""}</span>`).join("");
  const last = S.stage === 3 && S.sub === RAYSTEPS.length;
  $("bPrev").disabled = S.stage === 0; $("bNext").disabled = last; $("bRay").disabled = last;
  $("sX").disabled = S.stage < 2; $("sY").disabled = S.stage < 2;
}
function setStage(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === S.stage) return;
  const prev = S.stage; S.stage = n; S.sub = n === 3 ? (prev < 3 ? 1 : S.sub) : 0;
  if (n < 2) { S.px = 20; S.py = 30; }
  syncSliders(); buildSteps(); updateReadout();
}
function next() { if (S.stage === 3) { if (S.sub < RAYSTEPS.length) { S.sub++; buildSteps(); } } else setStage(S.stage + 1); }
function prev() { if (S.stage === 3 && S.sub > 1) { S.sub--; buildSteps(); } else setStage(S.stage - 1); }
function syncSliders() { $("sX").value = S.px; $("sY").value = S.py; $("vX").textContent = S.px + " ซม."; $("vY").textContent = S.py + " ซม."; }
/* อ่านค่า: บอกเฉพาะตำแหน่งปากกา · พิกัดภาพให้นักเรียนอ่านเองจากกริด (งานในใบ O) */
function updateReadout() {
  const r = $("readout");
  if (S.stage < 2) { r.style.display = "none"; return; }
  r.style.display = "block"; r.innerHTML = `ปากกาที่ (${S.px}, ${S.py}) · <b>กริดช่องละ 10 ซม.</b>`;
}
$("bNext").onclick = next; $("bPrev").onclick = prev;
$("bRay").onclick = () => S.stage < 3 ? setStage(3) : next();
$("sX").oninput = e => { S.px = +e.target.value; syncSliders(); updateReadout(); };
$("sY").oninput = e => { S.py = +e.target.value; syncSliders(); updateReadout(); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$("b2d").onclick = () => setMode("2d"); $("b3d").onclick = () => setMode("3d");
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "r" || e.key === "R") setStage(Math.max(S.stage, 2));
  else if (e.key === "n" || e.key === "N") $("bRay").click();
  else if (e.key === "d" || e.key === "D") setMode(S.mode === "2d" ? "3d" : "2d");
  else if (e.key === "f" || e.key === "F") $("bFull").click();
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
});

/* ===== 2D: มองจากด้านบน · มาตราส่วนคงที่ (กรอบครอบภาพทุกค่าตัวปรับ) ===== */
const c2 = $("c2d"), g = c2.getContext("2d");
const B2 = { x0: -52, x1: 72, y0: -52, y1: 60 };
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  return { w: cv.width, h: cv.height, dpr };
}
function draw2D() {
  const { w, h, dpr } = fit(c2), px = v => v * dpr;
  const sc = Math.min(w / (B2.x1 - B2.x0), h / (B2.y1 - B2.y0)) * 0.97;
  const ox = (w - (B2.x1 - B2.x0) * sc) / 2 - B2.x0 * sc, oy = (h - (B2.y1 - B2.y0) * sc) / 2 + B2.y1 * sc;
  const P = (x, y) => [ox + x * sc, oy - y * sc];
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  g.fillStyle = "#4a3526"; g.fillRect(0, 0, w, h);
  { const [a, b] = P(-50, 58), [c, d] = P(70, -50); g.fillStyle = "#f4f1e8"; g.fillRect(a, b, c - a, d - b); }
  if (S.stage >= 1) {                                                /* ฝั่งหลังกระจก */
    g.fillStyle = "rgba(30,41,59,.25)";
    { const [a, b] = P(-50, 58), [c, d] = P(0, -50); g.fillRect(a, b, c - a, d - b); }
    { const [a, b] = P(0, 0), [c, d] = P(70, -50); g.fillRect(a, b, c - a, d - b); }
  }
  if (S.stage >= 2) grid(P, px, sc);
  /* ภาพของปากกา */
  if (S.stage >= 1) IMGS().forEach(([x, y, t]) => { pen(P, px, x, y, true); const [a, b] = P(x, y); tag(t, a + px(14), b + px(6), px, "#475569"); });
  pen(P, px, S.px, S.py, false); { const [a, b] = P(S.px, S.py); tag("ปากกา", a + px(14), b + px(6), px); }
  mirrors(P, px);
  /* รังสี */
  const k = RS(), R = paths(), Ps = R.P, E = R.E;
  const img = [[-S.px, S.py], [S.px, -S.py], [-S.px, -S.py]];
  const one = (q, ax, k0, col, im) => {
    if (!q || k < k0) return;
    seg(P(...Ps), P(...q), col, px);
    if (k >= k0 + 1) normal2D(P, px, q, ax);
    if (k >= k0 + 2) seg(P(...q), P(...E), col, px);
    if (k >= k0 + 3) dash(P(...q), P(...im), col, px);
  };
  one(R.r1, 0, 1, "#fb923c", img[0]);
  one(R.r2, 1, 5, "#38bdf8", img[1]);
