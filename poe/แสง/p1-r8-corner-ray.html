<script>
/* ===== ค่าของฉาก (ตรงกับสิมเดิมในไฟล์แผน 1 · มองจากด้านบนของโต๊ะ · หน่วย ซม. · มุมวัดทวนเข็มจากแกน +x) =====
   กระจก 1 บน x = 0 · กระจก 2 บน y = 0 มุมกระจกที่จุดกำเนิด · รังสีเข้าตกที่กระจก 1 ที่ (0, 10) มุมตกกระทบ a (วัดจากเส้นปกติ +x)
   สะท้อนไปตกที่กระจก 2 ที่ (10/tan a, 0) มุมตกกระทบ 90° − a · รังสีออกทิศ a = ขนานสวนทางกับรังสีเข้า
   ของจริง: ครูสาธิตด้วยกล่องแสง 1 มุมตามแผน */
const Y1 = 10, ML1 = 30, ML2 = 34, RB = 30, RO = 30, PR = 9;
const STAGES = ["ฉากก่อนผล", "เล่น", "อ่านค่า", "รังสีทีละเส้น"];
/* ขั้นรังสีแสดงทีละเส้น · ทุกจุดสะท้อนมีเส้นปกติเสมอ (ครูกำหนด 28 ก.ย. 2569) */
const RAYSTEPS = ["รังสีตกกระทบ", "เส้นปกติ บาน 1", "สะท้อนครั้งแรก", "เส้นปกติ บาน 2", "สะท้อนครั้งที่สอง", "มุมตกกระทบสองบาน", "รังสีออกเทียบรังสีเข้า"];
const S = { stage: 0, sub: 0, a: 25, grow: 0, anim: null, mode: "2d" };
const RS = () => S.stage === 3 ? S.sub : 0;
const rad = d => d * Math.PI / 180, dir = (a, L) => [L * Math.cos(rad(a)), L * Math.sin(rad(a))];
const H1 = () => [0, Y1], H2 = () => [Y1 / Math.tan(rad(S.a)), 0];
const SRC = () => { const d = dir(S.a, RB); return [d[0], Y1 + d[1]]; };   /* กล่องแสงอยู่ทิศ a จากจุดตกกระทบบานแรก */
const OUT = () => { const h = H2(), d = dir(S.a, RO); return [h[0] + d[0], d[1]]; };
const $ = id => document.getElementById(id);

/* ===== แถบขั้นและปุ่ม ===== */
function buildSteps() {
  $("steps").innerHTML = STAGES.map((t, k) => `<span class="step ${k === S.stage ? "on" : k < S.stage ? "done" : ""}">${k + 1} ${t}${k === 3 && S.stage === 3 ? ` · ${RAYSTEPS[S.sub - 1]} (${S.sub}/${RAYSTEPS.length})` : ""}</span>`).join("");
  const last = S.stage === 3 && S.sub === RAYSTEPS.length;
  $("bPrev").disabled = S.stage === 0; $("bNext").disabled = last; $("bRay").disabled = last;
  $("sA").disabled = S.stage < 2;
}
function setStage(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === S.stage) return;
  const prev = S.stage; S.stage = n; S.sub = n === 3 ? (prev < 3 ? 1 : S.sub) : 0;
  if (n === 0) { S.anim = null; S.a = 25; S.grow = 0; }
  if (n === 1 && prev === 0) S.anim = { t0: performance.now(), dur: 2600 };   /* ลำแสงเดินต่อจากบานแรก ไปบานที่สอง แล้วออก */
  if (n >= 2) { S.anim = null; S.grow = 1; }
  if (n < 2) S.a = 25;
  syncSliders(); buildSteps(); updateReadout();
}
function next() { if (S.stage === 3) { if (S.sub < RAYSTEPS.length) { S.sub++; buildSteps(); } } else setStage(S.stage + 1); }
function prev() { if (S.stage === 3 && S.sub > 1) { S.sub--; buildSteps(); } else setStage(S.stage - 1); }
function syncSliders() { $("sA").value = S.a; $("vA").textContent = S.a + "°"; }
function tickAnim(now) {
  if (!S.anim) return;
  const u = Math.min(1, (now - S.anim.t0) / S.anim.dur); S.grow = u;
  if (u >= 1) { S.grow = 1; S.anim = null; buildSteps(); }
}
/* อ่านค่า: บอกเฉพาะมุมที่ยิง (เงื่อนไข) · มุมตกกระทบบานที่สองให้นักเรียนอ่านเองจากโปรแทรกเตอร์ (งานในใบ O) */
function updateReadout() {
  const r = $("readout");
  if (S.stage < 2) { r.style.display = "none"; return; }
  r.style.display = "block"; r.innerHTML = `มุมตกกระทบที่บานแรก <b>${S.a}°</b>`;
}
$("bNext").onclick = next; $("bPrev").onclick = prev;
$("bRay").onclick = () => S.stage < 3 ? setStage(3) : next();
$("sA").oninput = e => { S.a = +e.target.value; syncSliders(); updateReadout(); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$("b2d").onclick = () => setMode("2d"); $("b3d").onclick = () => setMode("3d");
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "r" || e.key === "R") setStage(Math.max(S.stage, 2));
  else if (e.key === "n" || e.key === "N") $("bRay").click();
  else if (e.key === "d" || e.key === "D") setMode(S.mode === "2d" ? "3d" : "2d");
  else if (e.key === "f" || e.key === "F") $("bFull").click();
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
});

/* ===== 2D: มองจากด้านบน · มาตราส่วนคงที่ (กรอบครอบกล่องแสงและรังสีออกทุกมุม 25–70°) ===== */
const c2 = $("c2d"), g = c2.getContext("2d");
const B2 = { x0: -8, x1: 54, y0: -7, y1: 44 };
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  return { w: cv.width, h: cv.height, dpr };
}
/* ความยาวของเส้นทางแสงทั้งหมด ใช้ทำลำแสงเดินในขั้นเล่น */
function pathPts() { return [SRC(), H1(), H2(), OUT()]; }
function partial(pts, u) {
  const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(l); tot += l; }
  let rem = u * tot; const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) { if (rem >= L[i - 1]) { out.push(pts[i]); rem -= L[i - 1]; } else { const t = rem / L[i - 1]; out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]); break; } }
  return out;
}
function draw2D() {
  const { w, h, dpr } = fit(c2), px = v => v * dpr;
  const sc = Math.min(w / (B2.x1 - B2.x0), h / (B2.y1 - B2.y0)) * 0.97;
  const ox = (w - (B2.x1 - B2.x0) * sc) / 2 - B2.x0 * sc, oy = (h - (B2.y1 - B2.y0) * sc) / 2 + B2.y1 * sc;
  const P = (x, y) => [ox + x * sc, oy - y * sc];
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  g.fillStyle = "#4a3526"; g.fillRect(0, 0, w, h);
  for (let y = -30; y < 80; y += 4) { const [, b] = P(0, y); g.strokeStyle = "#3d2b1f"; g.lineWidth = px(1); g.beginPath(); g.moveTo(0, b); g.lineTo(w, b); g.stroke(); }
  { const [a, b] = P(-4, 42), [c, d] = P(52, -4); g.fillStyle = "#f4f1e8"; g.fillRect(a, b, c - a, d - b); }
  if (S.stage >= 2) protractor(P(...H2()), px, sc);
  const k = RS(), h1 = H1(), h2 = H2(), src = SRC(), out = OUT();
  if (S.stage < 3) {
    const u = S.stage === 0 ? null : S.grow;                          /* ฉากก่อนผล: ลำแสงถึงแค่กระจก 1 · ขั้นเล่น: เดินต่อไปจนออก */
    const seq = u === null ? [src, h1] : partialFrom(u);
    for (let i = 1; i < seq.length; i++) beam(P(...seq[i - 1]), P(...seq[i]), px);
    normal2D(P, px, h1, 0);
    if (u !== null && reached(u, 2)) normal2D(P, px, h2, 1);
    arcMark(P, px, sc, h1, 0, S.a, 6, "#0f172a", `${S.a}°`);        /* เงื่อนไขในโจทย์: มุมตกกระทบบานแรก */
  } else {
    seg(P(...src), P(...h1), "#e11d48", px);
    if (k >= 2) normal2D(P, px, h1, 0);
    if (k >= 3) seg(P(...h1), P(...h2), "#fb923c", px);
    if (k >= 4) normal2D(P, px, h2, 1);
    if (k >= 5) seg(P(...h2), P(...out), "#f472b6", px);
    if (k >= 6) { arcMark(P, px, sc, h1, 0, S.a, 6, "#0f172a", `${S.a}°`); arcMark(P, px, sc, h2, 90 - (90 - S.a), 90, 6, "#b45309", `${90 - S.a}°`); }
    if (k >= 7) {                                                   /* เลื่อนรังสีเข้ามาวางคู่รังสีออก: ขนานกัน ทิศตรงข้าม */
      g.save(); g.strokeStyle = "#e11d48"; g.lineWidth = px(2.2); g.setLineDash([px(8), px(7)]);
      const [a, b] = P(...h2), [c, d] = P(h2[0] + (src[0] - h1[0]), src[1] - h1[1]); g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); g.restore();
      const m = P(h2[0] + (out[0] - h2[0]) * 0.7, out[1] * 0.7); tag(`รวม ${S.a}° + ${90 - S.a}° = 90°`, m[0] + px(18), m[1] + px(40), px);
    }
  }
  mirrors(P, px);
  rayBox(P, px, sc);
}
/* ส่วนของลำแสงที่เดินไปถึงแล้วในขั้นเล่น: เริ่มจากกระจก 1 (ส่วนแรกมีตั้งแต่ฉากก่อนผล) */
function partialFrom(u) {
  const pts = pathPts(), first = [pts[0], pts[1]];
  const rest = partial([pts[1], pts[2], pts[3]], u);
  return first.concat(rest.slice(1));
}
function reached(u, idx) { const pts = pathPts(), l1 = Math.hypot(pts[2][0] - pts[1][0], pts[2][1] - pts[1][1]), l2 = Math.hypot(pts[3][0] - pts[2][0], pts[3][1] - pts[2][1]); return u * (l1 + l2) >= l1 - 1e-6; }
function beam(a, b, px) {
  g.save(); g.lineCap = "round";
  g.strokeStyle = "rgba(239,68,68,.25)"; g.lineWidth = px(12); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  g.strokeStyle = "#ef4444"; g.lineWidth = px(3); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  g.restore();
}
function seg(a, b, col, px) {
  g.strokeStyle = col; g.lineWidth = px(3.4); g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();

/* โปรแทรกเตอร์ครึ่งวงกลมวางที่จุดตกกระทบบานที่สอง 0° ทางขวา ขีดละ 1° ตัวเลขทุก 10° */

/* ===== 3D: โต๊ะ กล่องแสง กระจกสองบาน ลำแสงคำนวณจากกฎการสะท้อน ===== */
let T = null;
function init3D() {

  const gl = new THREE.MeshPhongMaterial({ color: 0xbae6fd, shininess: 120, specular: 0xffffff });
  const m1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 6, ML1), gl); m1.position.set(-0.25, 3, -ML1 / 2); sc.add(m1);

  const m2 = new THREE.Mesh(new THREE.BoxGeometry(ML2, 6, 0.5), gl); m2.position.set(ML2 / 2, 3, 0.25); sc.add(m2);
  const b2 = new THREE.Mesh(new THREE.BoxGeometry(ML2, 6, 0.4), L(0x64748b)); b2.position.set(ML2 / 2, 3, 0.7); sc.add(b2);
  const box = new THREE.Group(); sc.add(box);
  const bb = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 5.2), L(0x1f2937)); bb.position.y = 2.5; box.add(bb);
  const slit = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.8), Bm(0xfde68a)); slit.position.set(-4.05, 1.5, 0); box.add(slit);

  { const c = 512, r = 500; px2.fillStyle = "rgba(186,230,253,.5)"; px2.beginPath(); px2.moveTo(c - r, c); px2.arc(c, c, r, Math.PI, 2 * Math.PI); px2.closePath(); px2.fill();
    px2.strokeStyle = "#075985"; px2.fillStyle = "#075985"; px2.textAlign = "center"; px2.font = "44px 'Share Tech Mono'";
    for (let a = 0; a <= 180; a++) { const t = rad(a), Lk = a % 10 === 0 ? 60 : a % 5 === 0 ? 40 : 22; px2.lineWidth = a % 5 ? 2 : 4; px2.beginPath(); px2.moveTo(c + Math.cos(t) * r, c - Math.sin(t) * r); px2.lineTo(c + Math.cos(t) * (r - Lk), c - Math.sin(t) * (r - Lk)); px2.stroke();
      if (a % 30 === 0) px2.fillText(String(a), c + Math.cos(t) * (r - 120), c - Math.sin(t) * (r - 120) + 14); } }

/* ===== สลับโหมดและลูปหลัก ===== */
function setMode(m) {

}
